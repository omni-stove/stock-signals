# PR の品質ゲート。pnpm のセットアップ + 依存インストール (ルート/worker) + `pnpm run verify`
# (lint + typecheck + worker typecheck + knip) を回す共通アクション。
# checkout 済みの作業ツリーに対して実行する前提 (checkout はワークフロー側で行う)。
name: Verify
description: Install dependencies and run `pnpm run verify`.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: latest

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm

    # lockfile は dependabot automerge の verify を通った時点で検証済みのため、install では
    # pnpm の minimumReleaseAge (publish 直後の新バージョンを弾くデフォルトポリシー) を 0 に
    # 無効化して lockfile を信頼する。これがないと依存 bump 直後 (24h 未満) の install が落ちる。
    - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      shell: bash

    - run: pnpm -C worker install --frozen-lockfile --config.minimumReleaseAge=0
      shell: bash

    - run: pnpm run verify
      shell: bash
