version: 2
registries:
  npm-public:
    type: npm-registry
    url: https://registry.npmjs.org
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-public
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/worker"
    registries:
      - npm-public
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
