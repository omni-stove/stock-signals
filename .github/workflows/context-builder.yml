# 新規IR/ニュース → Claude Code Action で「銘柄コンテキスト(D1)」を更新 → signal-judge を起動。
#
# 2段アーキテクチャの前段。Worker (Cloudflare) が IR(寄り前 8:30 / 昼 12:30 / 引け後 20:00) と
# per_ticker ニュース(IR時刻 + 場中5分毎)を取得し、どちらかに新規があった銘柄ごとに
# repository_dispatch (event_type=signal-update) でこのワークフローを起動する (1銘柄=1 dispatch、
# client_payload.ticker に単一銘柄)。新規が無い時刻は起動しないので、LLM は新規があるときしか動かない。
#
# 起動後は step が Worker /context-input を 1 call で引き(既存コンテキスト本文 + 2カーソル以降の
# 新規 IR/ニュースを正規化済み JSON で同梱)、再生成ルールを prompt にベタ書きした Claude Code Action
# がそれを @ で読んで銘柄の持続コンテキスト(経営判断/商品ラインナップ/技術ロードマップ + 直近の重大
# トピック要約)を structured_output で返す。判定(buy/sell)はここでは出さない。後続ステップ
# (post-context.sh) が D1 (Worker /context) を更新し全文を Slack (SLACK_CONTEXT_CHANNEL) に投稿、
# 別ステップが repository_dispatch (event_type=signal-judge) で後段の判定を起動する。
#
# 判定は signal-judge.yml が担う(D1 コンテキスト+価格/地合いを読み Slackに通知)。コンテキストには
# 判定を書かないので、judge → context の編集ループは物理的に発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側 (発火元) は GitHub App (omnistove-internal-auth) で repository_dispatch する。

name: context-builder

on:
  # Worker が新規IR/ニュース取得時に銘柄ごとに叩く。client_payload.ticker に対象銘柄が入る。
  repository_dispatch:
    types: [signal-update]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード
        required: true
        type: choice
        # worker/src/lib/watchlist.ts の TICKERS と同期させる。
        # 下の options は `npm run gen:watchlist` が自動生成する (手で編集しないこと)。
        options:
          # GEN:watchlist:start
          - "285A"  # キオクシアホールディングス
          - "6857"  # アドバンテスト
          - "6920"  # レーザーテック
          - "6976"  # 太陽誘電
          - "6981"  # 村田製作所
          # GEN:watchlist:end

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新着が来たら古いジョブをキャンセルして
# 新しい材料を含むジョブだけ走らせる。skill は最後に D1 を一括上書き (本文+カーソルを原子的に) するので、
# キャンセルされてもカーソル未更新 → 次回 dispatch で取りこぼし分も含めて再判定される (冪等)。
concurrency:
  group: context-builder-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: write   # signal-judge を repos/.../dispatches で起動するのに書き込みトークンが要る
  id-token: write   # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  context-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload/inputs.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 入力コンテキスト (既存本文 + 2カーソル以降の新規 IR/ニュース) を Worker /context-input が
      # 1 call で返す。/context 取得・カーソル抽出・新規取得・新規0判定・次カーソル算出は Worker 側
      # (決定論的) で完結し、skill には fetch を叩かせず「新規アイテムの取捨選択と本文の再生成」だけを
      # させる。JSON は本文込みで巨大・特殊文字を含むので prompt に直接埋めず、ファイルに書いて
      # skill にパスを渡す。skill はそのファイルを Read するだけ。status (no-update / ok) で分岐する。
      #
      # 当該銘柄の判定メタ (name/fair_per/sector/note) は静的な watchlist.ts から
      # scripts/watchlist-meta.sh で抜き、ticker_meta として同梱する (skill が watchlist.ts 全体を
      # 読まずに当該銘柄分だけ受け取れる)。
      - name: Build context input
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/context-input?code=${TICKER}${FORCE:+&force=1}" > "$RUNNER_TEMP/ctxin.raw.json"
          META="$(bash scripts/watchlist-meta.sh "$TICKER")"
          jq --argjson meta "$META" '. + {ticker_meta:$meta}' \
            "$RUNNER_TEMP/ctxin.raw.json" > "$RUNNER_TEMP/ctxin.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload/inputs 由来の ticker は run へ生展開せず env 経由で渡す。
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          # 手動実行時のみ force=1: 新規ゼロでも既存 body を現行ルールで再生成する。
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      # 再生成ルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる入力コンテキスト
      # (既存本文 + 新規 IR/ニュース) だけを @ でファイルから取り込む (外部由来 JSON を ${{ }} で prompt に
      # 生展開せず YAML 破壊・prompt インジェクションを防ぐ)。ticker は Validate 済みなので prose に展開
      # してよい。skill は @ で読み込んで再生成本文 + カーソル (または no-update) を structured_output で
      # 返すだけ — curl も file write もしない。upsert と Slack 投稿は次ステップ (post-context.sh) が行う。
      - name: Run context-builder
        id: builder
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker(GitHub App=omnistove-internal-auth)発の repository_dispatch を許可する。
          # 既定では Bot起動のワークフローを Action が弾くため。bot名は [bot] サフィックス付き。
          allowed_bots: "omnistove-internal-auth[bot]"
          prompt: |
            # context-builder — 対象銘柄 ${{ github.event.client_payload.ticker || inputs.ticker }}

            Regenerate this ticker's *living context* for a SWING-trading horizon (several days to a few weeks).

            The bar for every line is whether it moves the swing call over the next weeks, not whether it is
            true or on-topic. Carry the judgment-bearing fact, not the catalog entry behind it: drop catalog
            detail (model numbers, spec figures, release dates, entity/person names, trademark symbols) and
            collapse variant lists into the one line that carries the call. When in doubt, cut.

            One fact lives in one section. Place it where its lasting effect belongs and do not restate it elsewhere.

            ## Inputs

            The input JSON is embedded inline below (`ticker_meta` with the ticker's `name` / `fair_per` /
            `sector` / `note`; the existing context body; the two cursors; the new IR/news). Do not post to
            Slack; do not upsert; do not run any script; do not write any file — return structured output and stop.

            ## Steps

            ### 1. Read the input JSON and branch on `status`

            Take `ticker_meta` for the heading `name`; let its `note` qualify what a fact means for this name, never override an item.

            - input `status: "no-update"`, or any status you can't read, or unreadable input → return
              `{status:"no-update"}` (no body, no cursors) and stop.
            - input `status: "ok"` → continue to step 2.

            `ir_items` are official IR + TDnet + `rating`, lead on them. `news_items` are per-ticker news, noisier
            — confirm against an IR item or drop. Both are already filtered to since each cursor and ordered
            oldest-first. Empty `context_body` means first run — build the body from scratch (step 3).

            ### 2. Read each new item and select what is material to the context

            Keep an item only when it shifts the swing call: a management or capital decision, a generation
            move in the product lineup or roadmap, a structural supply/demand turn that outlives a session, or
            earnings/guidance against expectations. Judge each on what the item itself states now, never on a
            later outcome. Reduce each to its judgment-bearing fact. Never a buy/sell view, the day's tape, or a
            restatement of something already recorded.

            A fresh material fact enters the 直近の重大トピック section while its near-term effect is live, then
            leaves once that effect is spent and only its lasting consequence remains in a structural section.
            Securities ratings (`ir_category="rating"`) route to the 証券会社レーティング section regardless of age,
            never the topics section.

            ### 3. Regenerate the whole set of sections

            Rebuild every section, not incremental edits. Emit these sections in this order (the schema fixes
            the title, headings, and plain-text shape):

            - 事業の骨格 — rarely-changing structural facts: what the company is, where it sits in the value
              chain, production base, technology lineage. A few lines that tell a continuation from a reversal,
              not a company profile.
            - 商品ラインナップ / 技術ロードマップ — current generation and where the next one stands; one line
              per product line, named by generation and market position only.
            - 経営判断・資本政策 — capex / capacity / M&A / alliances / capital policy; accumulate and revise on
              material events.
            - 直近の重大トピック — newest first by date; each line `YYYY-MM-DD: <one-line summary> — <その先数
              週間への効き>`, tight enough to stay one line. Keep roughly the last ~6–10; prune once an effect is
              absorbed into a structural section.
            - 証券会社レーティング — newest first; each line `YYYY-MM-DD <機関>: <格付> 目標株価 <値> [信頼度: …]`.
              Keep while in ~12-month horizon; drop when the same 機関 issues a newer call.
            - 決算の特色・クセ — structural reaction pattern of this name's earnings: focus metric, ガイダンス vs
              実績 の効き方, ピア連動. When empty, research it once (web / past IR) and fill; otherwise revise only
              when fresh `ir_items` carry a 決算/業績修正/ガイダンス item, else carry it forward verbatim.
            - 決算・ガイダンス — latest results vs expectations, current guidance, known next-earnings
              considerations — facts only.

            ### 4. Return the advanced cursors

            Return `ir_cursor` = `cursors.ir.next` verbatim and `news_cursor` = `cursors.news.next` verbatim
            (null if a cursor is null).

            ## Output

            Return structured output (the workflow constrains the shape): `status` (`ok` / `no-update`), and
            when `ok` the regenerated `title` + `sections` plus the two advanced cursors.

            ## 入力コンテキスト

            @${{ runner.temp }}/ctxin.json
          # LLM に curl/sh を叩かせない: upsert/投稿は次ステップが行うので Bash/Write は渡さず Read のみ許可。
          # --json-schema で出力の形を縛る。status=no-update は本文を書かず終了する信号。
          # ok のとき title+sections=再生成コンテキスト (Markdown 記号なし)、ir_cursor/news_cursor=進めたカーソル (null 可)。
          claude_args: >-
            --allowedTools Read --max-turns 50
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["status"],
              "properties":{
                "status":{"enum":["ok","no-update"],"description":"新規があり再生成したら ok、新規 0 なら no-update"},
                "title":{"type":["string","null"],"description":"見出しタイトル。verbatim shape: [<ticker> <name>] 銘柄コンテキスト。no-update なら null"},
                "sections":{"type":["array","null"],"description":"見出し+行のセクション配列。prompt の順序と exact heading 文字列で全セクションを出す (行が無くても残す)。no-update なら null",
                  "items":{"type":"object","additionalProperties":false,"required":["heading","lines"],
                    "properties":{
                      "heading":{"type":"string","description":"セクション見出し。Markdown 記号 (#/*/-/backtick) なしのプレーンテキスト"},
                      "lines":{"type":"array","items":{"type":"string"},"description":"本文行。1 行 1 要素、Markdown 記号なし。該当なしは空配列"}
                    }}},
                "ir_cursor":{"type":["string","null"],"description":"進めた IR カーソル (cursors.ir.next)。無ければ null"},
                "news_cursor":{"type":["string","null"],"description":"進めた news カーソル (cursors.news.next)。無ければ null"}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # skill の構造化出力 (structured_output) を post-context.sh に渡す。status="no-update" なら
      # post-context.sh が upsert/投稿をスキップする (判定だけ次の dispatch で回す)。
      - name: Upsert context and post to Slack
        run: |
          printf '%s' "$CONTEXT_JSON" > "$RUNNER_TEMP/context.json"
          bash scripts/post-context.sh "$TICKER" "$RUNNER_TEMP/context.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          # context-builder が D1 更新後に living document 全文を投稿する Slack チャンネル。
          SLACK_CONTEXT_CHANNEL: ${{ vars.SLACK_CONTEXT_CHANNEL }}
          CONTEXT_JSON: ${{ steps.builder.outputs.structured_output }}

      # 新規 IR/ニュースの有無によらず、skill 実行後は必ず signal-judge を 1 回発火する。
      # 発火を skill (post-context.sh = 新規があったときだけ走る) から切り離してここに一本化したのは、
      # 新規が無い銘柄でも価格/地合いの変化を毎営業日ひろって判定を回したいため
      # (出来高/話題の薄い銘柄が「新規ニュース 0 = 判定も来ない」状態に陥っていた)。
      # if: always() で skill が失敗・キャンセルされても判定だけは回す。
      # Worker 側 intake cron も新規有無によらず全銘柄を signal-update する (cron.ts) ので、
      # 寄り前/引け後ごとに全銘柄が確実に judge される。
      - name: Dispatch signal-judge (unconditional)
        if: always()
        run: bash scripts/dispatch-judge.sh "$TICKER"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
