# 新規IR/ニュース → Claude Code Action で「銘柄コンテキスト(D1)」を更新 → ticker-brief を起動。
#
# 2段アーキテクチャの前段。Worker (Cloudflare) が IR(寄り前 8:30 / 昼 12:30 / 引け後 20:00) と
# per_ticker ニュース(IR時刻 + 場中5分毎)を取得し、どちらかに新規があった銘柄ごとに
# repository_dispatch (event_type=signal-update) でこのワークフローを起動する (1銘柄=1 dispatch、
# client_payload.ticker に単一銘柄)。新規が無い時刻は起動しないので、LLM は新規があるときしか動かない。
#
# 起動後は step が Worker /context-input を 1 call で引き(既存コンテキスト本文 + 2カーソル以降の
# 新規 IR/ニュースを正規化済み JSON で同梱)、再生成ルールを prompt にベタ書きした Claude Code Action
# がそれを @ で読んで銘柄の持続コンテキスト(経営判断/商品ラインナップ/技術ロードマップ + 直近の重大
# トピック要約)を structured_output で返す。売買判断はここでは出さない。後続ステップ
# (post-context.sh) が D1 (Worker /context) を更新し全文を Slack (SLACK_CONTEXT_CHANNEL) に投稿、
# 別ステップが status=ok (新着材料あり) のときだけ repository_dispatch (event_type=ticker-brief) で
# 後段の材料ブリーフを起動する。
#
# 材料ブリーフは ticker-brief.yml が担う(D1 コンテキスト+価格/市場ブリーフを読み Slackに通知)。
# コンテキストにはブリーフを書かないので、brief → context の編集ループは物理的に発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側 (発火元) は GitHub App (omnistove-internal-auth) で repository_dispatch する。

name: context-builder

on:
  # Worker が新規IR/ニュース取得時に銘柄ごとに叩く。client_payload.ticker に対象銘柄が入る。
  repository_dispatch:
    types: [signal-update]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード
        required: true
        type: choice
        # worker/src/lib/watchlist.ts の TICKERS と同期させる。
        # 下の options は `npm run gen:watchlist` が自動生成する (手で編集しないこと)。
        options:
          # GEN:watchlist:start
          - "285A"  # キオクシアホールディングス
          - "6857"  # アドバンテスト
          - "6920"  # レーザーテック
          - "6976"  # 太陽誘電
          - "6981"  # 村田製作所
          # GEN:watchlist:end

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新着が来たら古いジョブをキャンセルして
# 新しい材料を含むジョブだけ走らせる。skill は最後に D1 を一括上書き (本文+カーソルを原子的に) するので、
# キャンセルされてもカーソル未更新 → 次回 dispatch で取りこぼし分も含めて再判定される (冪等)。
concurrency:
  group: context-builder-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: write   # ticker-brief を repos/.../dispatches で起動するのに書き込みトークンが要る
  id-token: write   # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  context-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload/inputs.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 入力コンテキスト (既存本文 + 2カーソル以降の新規 IR/ニュース) を Worker /context-input が
      # 1 call で返す。/context 取得・カーソル抽出・新規取得・新規0判定・次カーソル算出は Worker 側
      # (決定論的) で完結し、skill には fetch を叩かせず「新規アイテムの取捨選択と本文の再生成」だけを
      # させる。JSON は本文込みで巨大・特殊文字を含むので prompt に直接埋めず、ファイルに書いて
      # skill にパスを渡す。skill はそのファイルを Read するだけ。status (no-update / ok) で分岐する。
      #
      # 当該銘柄の判定メタ (name/sector/note) は静的な watchlist.ts から
      # scripts/watchlist-meta.sh で抜き、ticker_meta として同梱する (skill が watchlist.ts 全体を
      # 読まずに当該銘柄分だけ受け取れる)。
      - name: Build context input
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/context-input?code=${TICKER}${FORCE:+&force=1}" > "$RUNNER_TEMP/ctxin.raw.json"
          META="$(bash scripts/watchlist-meta.sh "$TICKER")"
          jq --argjson meta "$META" '. + {ticker_meta:$meta}' \
            "$RUNNER_TEMP/ctxin.raw.json" > "$RUNNER_TEMP/ctxin.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload/inputs 由来の ticker は run へ生展開せず env 経由で渡す。
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          # 手動実行時のみ force=1: 新規ゼロでも既存 body を現行ルールで再生成する。
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      # 再生成ルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる入力コンテキスト
      # (既存本文 + 新規 IR/ニュース) だけを @ でファイルから取り込む (外部由来 JSON を ${{ }} で prompt に
      # 生展開せず YAML 破壊・prompt インジェクションを防ぐ)。ticker は Validate 済みなので prose に展開
      # してよい。skill は @ で読み込んで再生成本文 + カーソル (または no-update) を structured_output で
      # 返すだけ — curl も file write もしない。upsert と Slack 投稿は次ステップ (post-context.sh) が行う。
      - name: Run context-builder
        id: builder
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker(GitHub App=omnistove-internal-auth)発の repository_dispatch を許可する。
          # 既定では Bot起動のワークフローを Action が弾くため。bot名は [bot] サフィックス付き。
          allowed_bots: "omnistove-internal-auth[bot]"
          prompt: |
            # context-builder — 対象銘柄 ${{ github.event.client_payload.ticker || inputs.ticker }}

            Regenerate this ticker's *living context* for a SWING-trading horizon (several days to a few weeks).

            The bar for every line is whether it moves the swing call over the next weeks, not whether it is
            true or on-topic. Carry the judgment-bearing fact, not the catalog entry behind it: drop catalog
            detail (model numbers, spec figures, release dates, entity/person names, trademark symbols) and
            collapse variant lists into the one line that carries the call. When in doubt, cut.

            ## Inputs

            The input JSON is embedded inline below (`ticker_meta` with the ticker's `name` / `sector` /
            `note`; the existing context body; the two cursors; the new IR/news). Do not post to
            Slack; do not upsert; do not run any script; do not write any file — return structured output and stop.

            ## Steps

            ### 1. Read the input JSON and branch on `status`

            Let `ticker_meta.note` qualify what a fact means for this name, never override an item.

            - input `status: "no-update"`, or any status you can't read, or unreadable input → return
              `{status:"no-update"}` (no body, no cursors) and stop.
            - input `status: "ok"` → continue to step 2.

            `ir_items` are official IR + TDnet + `rating`, lead on them. `news_items` are per-ticker news, noisier
            — confirm against an IR item or drop. Both are already filtered to since each cursor and ordered
            oldest-first. Empty `context_body` means first run — build the body from scratch (step 3).
            `status: "ok"` with both item lists empty is a forced regeneration — never return no-update;
            rebuild the existing body under the current rules (step 3).

            ### 2. Read each new item and select what is material to the context

            Keep an item only when it shifts the swing call: a management or capital decision, a generation
            move in the product lineup or roadmap, a structural supply/demand turn that outlives a session, or
            earnings/guidance against expectations. Judge each on what the item itself states now, never on a
            later outcome. Reduce each to its judgment-bearing fact. Never a buy/sell view, the day's tape, or a
            restatement of something already recorded.

            A fresh material fact enters `topics` while its near-term effect is live, then leaves once that
            effect is spent and only its lasting consequence remains in a structural section. A securities
            rating (`ir_category="rating"`) enters `topics` only when the rating itself changes (格上げ/格下げ/
            新規) at a firm not marked 信頼度: 低; a target-price revision alone is not material. Never keep a
            standing list of ratings or target prices in any section.

            ### 3. Regenerate the whole set of sections

            Rebuild every section, not incremental edits, as each output field defines it.

            ## Input context

            @${{ runner.temp }}/ctxin.json
          # LLM に curl/sh を叩かせない: upsert/投稿は次ステップが行うので Bash/Write は渡さず Read のみ許可。
          # --json-schema で出力の形を縛る。status=no-update は本文を書かず終了する信号。
          # 出力の定義は schema の description に置く。claude_args はシェルとして解釈されるので description に ' を書かない。
          # sections のキーと見出しの対応、topics の行への連結は post-context.sh が持つ。
          # 合計量は LLM には目安 (~30 行) だけを渡し、上限 (40 行 / 2600 字) は post-context.sh が検証する。
          claude_args: >-
            --allowedTools Read --max-turns 50
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["status"],
              "properties":{
                "status":{"enum":["ok","no-update"]},
                "title":{"type":["string","null"],"description":"Exact format, verbatim: [<ticker> <name>] 銘柄コンテキスト, with name from ticker_meta. Null on no-update."},
                "sections":{"type":["object","null"],"additionalProperties":false,
                  "required":["business","products","management","topics","earnings_pattern","earnings"],
                  "description":"The regenerated context; an empty array when nothing applies. Null on no-update. Keep the whole to ~30 lines; do not carry every existing line forward. Write in Japanese plain text with no Markdown symbols. Give each line one point in about 50 characters, in clipped note style: the fact, then its effect. Do not end a line with a full stop, use polite endings or narrating connectives, or hedge unless the uncertainty is the point. Place each fact in the one section where its lasting effect belongs.",
                  "properties":{
                    "business":{"type":"array","maxItems":10,"items":{"type":"string","maxLength":80},"description":"Existing heading 事業の骨格. Rarely-changing structural facts: what the company is, where it sits in the value chain, production base, technology lineage. A few lines that tell a continuation from a reversal, not a company profile."},
                    "products":{"type":"array","maxItems":10,"items":{"type":"string","maxLength":80},"description":"Existing heading 商品ラインナップ / 技術ロードマップ. Current generation and where the next one stands; one line per product line, named by generation and market position only."},
                    "management":{"type":"array","maxItems":10,"items":{"type":"string","maxLength":80},"description":"Existing heading 経営判断・資本政策. Capex, capacity, M&A, alliances, capital policy; accumulate and revise on material events."},
                    "topics":{"type":"array","maxItems":10,"description":"Existing heading 直近の重大トピック. Newest first by date, about 6 items. Merge items telling one running story into the newest. Drop an item once its date is about 14 days old or its effect is absorbed into a structural section; keeping it requires the effect to still be live, not merely plausible.",
                      "items":{"type":"object","additionalProperties":false,"required":["date","summary","effect"],
                        "properties":{
                          "date":{"type":"string","pattern":"^[0-9]{4}-[0-9]{2}-[0-9]{2}$"},
                          "summary":{"type":"string","maxLength":50,"description":"What happened."},
                          "effect":{"type":"string","maxLength":40,"description":"Its effect over the next few weeks."}
                        }}},
                    "earnings_pattern":{"type":"array","maxItems":10,"items":{"type":"string","maxLength":80},"description":"Existing heading 決算の特色・クセ. Structural reaction pattern to earnings for this name: focus metric, how guidance vs results moves the stock, peer linkage. When empty, research it once (web / past IR) and fill; otherwise revise only when fresh ir_items carry an earnings, revision, or guidance item, else carry it forward verbatim."},
                    "earnings":{"type":"array","maxItems":10,"items":{"type":"string","maxLength":80},"description":"Existing heading 決算・ガイダンス. Latest own results vs expectations, current guidance, known next-earnings considerations; facts only. Never a recap of topics or peer/macro news."}
                  }},
                "ir_cursor":{"type":["string","null"],"description":"cursors.ir.next verbatim."},
                "news_cursor":{"type":["string","null"],"description":"cursors.news.next verbatim."}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # skill の構造化出力 (structured_output) を post-context.sh に渡す。status="no-update" なら
      # post-context.sh が upsert/投稿をスキップする (判定だけ次の dispatch で回す)。
      - name: Upsert context and post to Slack
        run: |
          printf '%s' "$CONTEXT_JSON" > "$RUNNER_TEMP/context.json"
          bash scripts/post-context.sh "$TICKER" "$RUNNER_TEMP/context.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          # context-builder が D1 更新後に living document 全文を投稿する Slack チャンネル。
          SLACK_CONTEXT_CHANNEL: ${{ vars.SLACK_CONTEXT_CHANNEL }}
          CONTEXT_JSON: ${{ steps.builder.outputs.structured_output }}

      # 新着材料があった (status=ok = コンテキストを再生成した) ときだけ ticker-brief を発火する。
      # 材料ブリーフは新着材料の解説なので、no-update (新規 0) の回は出すものが無く発火しない。
      # 手動の force 再生成 (workflow_dispatch) は新規 0 でも status=ok になるので必ずブリーフが続く。
      - name: Dispatch ticker-brief (on new material)
        run: |
          status="$(printf '%s' "$CONTEXT_JSON" | jq -r '.status // empty' 2>/dev/null || true)"
          if [ "$status" = "ok" ]; then
            bash scripts/dispatch-brief.sh "$TICKER"
          else
            echo "ticker-brief skipped (status=${status:-unreadable})"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          CONTEXT_JSON: ${{ steps.builder.outputs.structured_output }}
