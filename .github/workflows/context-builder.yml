# 新規IR/ニュース → Claude Code Action で「銘柄コンテキスト(D1)」を更新 → signal-judge を起動。
#
# 2段アーキテクチャの前段。Worker (Cloudflare) が IR(寄り前 8:30 / 昼 12:30 / 引け後 20:00) と
# per_ticker ニュース(IR時刻 + 場中5分毎)を取得し、どちらかに新規があった銘柄ごとに
# repository_dispatch (event_type=signal-update) でこのワークフローを起動する (1銘柄=1 dispatch、
# client_payload.ticker に単一銘柄)。新規が無い時刻は起動しないので、LLM は新規があるときしか動かない。
#
# 起動後は step が Worker /context-input を 1 call で引き(既存コンテキスト本文 + 2カーソル以降の
# 新規 IR/ニュースを正規化済み JSON で同梱)、.claude/skills/context-builder がそれを @path で読んで
# 銘柄の持続コンテキスト(経営判断/商品ラインナップ/技術ロードマップ + 直近の重大トピック要約)として
# D1 (Worker /context) を更新する。判定(buy/sell)は
# ここでは出さない。更新後は全文を Slack (SLACK_CONTEXT_CHANNEL) に投稿し、repository_dispatch
# (event_type=signal-judge) で後段の判定を起動する。
#
# 判定は signal-judge.yml が担う(D1 コンテキスト+価格/地合いを読み Slackに通知)。コンテキストには
# 判定を書かないので、judge → context の編集ループは物理的に発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側 (発火元) は GitHub App (omnistove-internal-auth) で repository_dispatch する。

name: context-builder

on:
  # Worker が新規IR/ニュース取得時に銘柄ごとに叩く。client_payload.ticker に対象銘柄が入る。
  repository_dispatch:
    types: [signal-update]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード
        required: true
        type: choice
        # worker/src/lib/watchlist.ts の TICKERS と同期させる。
        # 下の options は `npm run gen:watchlist` が自動生成する (手で編集しないこと)。
        options:
          # GEN:watchlist:start
          - "285A"  # キオクシアホールディングス
          - "6857"  # アドバンテスト
          - "6920"  # レーザーテック
          - "6981"  # 村田製作所
          # GEN:watchlist:end

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新着が来たら古いジョブをキャンセルして
# 新しい材料を含むジョブだけ走らせる。skill は最後に D1 を一括上書き (本文+カーソルを原子的に) するので、
# キャンセルされてもカーソル未更新 → 次回 dispatch で取りこぼし分も含めて再判定される (冪等)。
concurrency:
  group: context-builder-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: write   # signal-judge を repos/.../dispatches で起動するのに書き込みトークンが要る
  id-token: write   # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  context-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload/inputs.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 既存コンテキスト本文 + カーソル以降の新規 IR/ニュースを fetch + 正規化し、1 つの JSON に
      # 入力コンテキスト (既存本文 + 2カーソル以降の新規 IR/ニュース) を Worker /context-input が
      # 1 call で返す。/context 取得・カーソル抽出・新規取得・新規0判定・次カーソル算出は Worker 側
      # (決定論的) で完結し、skill には fetch を叩かせず「新規アイテムの取捨選択と本文の再生成」だけを
      # させる。JSON は本文込みで巨大・特殊文字を含むので prompt に直接埋めず、ファイルに書いて
      # skill にパスを渡す。skill はそのファイルを Read するだけ。status (no-update / ok) で分岐する。
      - name: Build context input
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/context-input?code=${TICKER}${FORCE:+&force=1}" > "$RUNNER_TEMP/ctxin.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload/inputs 由来の ticker は run へ生展開せず env 経由で渡す。
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          # 手動実行時のみ force=1: 新規ゼロでも既存 body を現行ルールで再生成する。
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Run context-builder skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker(GitHub App=omnistove-internal-auth)発の repository_dispatch を許可する。
          # 既定では Bot起動のワークフローを Action が弾くため。bot名は [bot] サフィックス付き。
          allowed_bots: "omnistove-internal-auth[bot]"
          # 第1引数=対象銘柄 (Worker発火時 client_payload.ticker / 手動時 inputs.ticker)。
          # @ で始まる第2引数=入力コンテキスト JSON (context-input.sh 出力) のパス。skill は Read する。
          # body= は再生成本文、cursors= は進めた 2 カーソルの出力先。新規があれば両方を Write し、
          # no-update なら何も書かない。upsert と Slack 投稿は次ステップ (post-context.sh) が行う。
          prompt: "/context-builder ${{ github.event.client_payload.ticker || inputs.ticker }} @${{ runner.temp }}/ctxin.json body=${{ runner.temp }}/context.md cursors=${{ runner.temp }}/cursors.txt"
          # LLM に curl/sh を叩かせない: upsert/投稿は次ステップが行うので Bash は渡さず Read,Write のみ許可。
          claude_args: "--allowedTools Read,Write --max-turns 50"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # skill が body を書いた (= 新規あり) ときだけ D1 upsert + 全文 Slack 投稿。no-update では
      # body ファイルが無いのでスキップする (post-context.sh には渡さず判定だけ次の dispatch で回す)。
      - name: Upsert context and post to Slack
        run: |
          if [[ -f "$RUNNER_TEMP/context.md" ]]; then
            bash scripts/post-context.sh "$TICKER" "$RUNNER_TEMP/context.md" "$RUNNER_TEMP/cursors.txt"
          else
            echo "$TICKER: no body written (no-update) — skip upsert/post"
          fi
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          # context-builder が D1 更新後に living document 全文を投稿する Slack チャンネル。
          SLACK_CONTEXT_CHANNEL: ${{ vars.SLACK_CONTEXT_CHANNEL }}

      # 新規 IR/ニュースの有無によらず、skill 実行後は必ず signal-judge を 1 回発火する。
      # 発火を skill (post-context.sh = 新規があったときだけ走る) から切り離してここに一本化したのは、
      # 新規が無い銘柄でも価格/地合いの変化を毎営業日ひろって判定を回したいため
      # (出来高/話題の薄い銘柄が「新規ニュース 0 = 判定も来ない」状態に陥っていた)。
      # if: always() で skill が失敗・キャンセルされても判定だけは回す。
      # Worker 側 intake cron も新規有無によらず全銘柄を signal-update する (cron.ts) ので、
      # 寄り前/引け後ごとに全銘柄が確実に judge される。
      - name: Dispatch signal-judge (unconditional)
        if: always()
        run: bash scripts/dispatch-judge.sh "$TICKER"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
