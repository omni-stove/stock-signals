# 新規IR/ニュース → Claude Code Action で「銘柄コンテキスト(Issue本文)」を更新 → signal-judge を起動。
#
# 2段アーキテクチャの前段。Worker (Cloudflare) が IR(8:30/12:30/18:30) と per_ticker ニュース
# (IR時刻 + 場中5分毎)を取得し、どちらかに新規があった銘柄ごとに repository_dispatch
# (event_type=signal-update) でこのワークフローを起動する (1銘柄=1 dispatch、
# client_payload.ticker に単一銘柄)。新規が無い時刻は起動しないので、LLM は新規があるときしか動かない。
#
# 起動後は .claude/skills/context-builder が Worker /pull(IR) と /pull-news(ニュース) を
# 「前回カーソル以降の新規だけ」本文込みで引き、銘柄の持続コンテキスト(経営判断/商品ラインナップ/
# 技術ロードマップ + 直近の重大トピック要約)として Issue本文を更新する。判定(buy/sell)はここでは
# 出さない。本文更新が終わったら repository_dispatch (event_type=signal-judge) で後段の判定を起動する。
#
# 判定は signal-judge.yml が担う(Issue本文+価格/地合いを読み Slackに通知)。本文には判定を書かない
# ので、judge → context の編集ループは物理的に発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側 (発火元) は GitHub App (omnistove-internal-auth) で repository_dispatch する。

name: context-builder

on:
  # Worker が新規IR/ニュース取得時に銘柄ごとに叩く。client_payload.ticker に対象銘柄が入る。
  repository_dispatch:
    types: [signal-update]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード
        required: true
        type: choice
        # config/watchlist.yaml の tickers と同期させる。
        options:
          - "285A"  # キオクシアホールディングス
          - "6857"  # アドバンテスト
          - "6920"  # レーザーテック
          - "6981"  # 村田製作所

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新着が来たら古いジョブをキャンセルして
# 新しい材料を含むジョブだけ走らせる。skill は最後に Issue を一括上書きするので、
# キャンセルされてもカーソル未更新 → 次回 dispatch で取りこぼし分も含めて再判定される (冪等)。
concurrency:
  group: context-builder-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: write   # signal-judge を repos/.../dispatches で起動するのに書き込みトークンが要る
  issues: write
  id-token: write   # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  context-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # 既存 Issue + カーソル以降の新規 IR/ニュースを fetch + 正規化し、1 つの JSON に
      # まとめて prompt に渡す。Issue 取得・カーソル抽出・/pull /pull-news の since 付き取得・
      # 新規0判定・次カーソル算出は決定論的なのでここ (step) で完結させ、skill には curl/gh を
      # 叩かせず「新規アイテムの取捨選択と本文の再生成」だけをさせる (signal-judge と同じ思想)。
      # JSON は Issue 本文込みで巨大・特殊文字を含むので prompt に直接埋めず、ファイルに書いて
      # skill にパスを渡す。skill はそのファイルを Read するだけ。status (no-issue / no-update /
      # ok) で skill の分岐が決まる。
      - name: Build context input
        run: |
          ticker="${{ github.event.client_payload.ticker || inputs.ticker }}"
          bash scripts/context-input.sh "$ticker" > "$RUNNER_TEMP/ctxin.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Run context-builder skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker(GitHub App=omnistove-internal-auth)発の repository_dispatch を許可する。
          # 既定では Bot起動のワークフローを Action が弾くため。bot名は [bot] サフィックス付き。
          allowed_bots: "omnistove-internal-auth[bot]"
          # 第1引数=対象銘柄 (Worker発火時 client_payload.ticker / 手動時 inputs.ticker)。
          # @ で始まる第2引数=入力コンテキスト JSON (context-input.sh 出力) のパス。
          # skill は JSON を Read し、新規があれば本文を再生成して gh issue edit で上書きし
          # signal-judge を dispatch する。curl/gh での fetch はしない。
          prompt: "/context-builder ${{ github.event.client_payload.ticker || inputs.ticker }} @${{ runner.temp }}/ctxin.json"
          # Actions の使い捨てサンドボックス内なので Bash を広く許可 (パイプ/heredoc/tmpfile書き込みが
          # 細かい Bash(gh:*) 指定だと弾かれ、リトライでターンを浪費して失敗していたため)。
          # ctxin.json を read するため Read も許可。
          claude_args: "--allowedTools Bash,Write,Read,Edit --max-turns 50"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
