# 銘柄コンテキスト + 価格/市場状況 → Claude Code Action で暴落プリモーテム → Slack通知。
#
# ticker-brief とは独立した補助ワークフロー。Slack の /crash スラッシュコマンドを受けた Worker が
# repository_dispatch (event_type=crash-scenario、client_payload.ticker に単一銘柄) で起動する。
# 売買判断ではなく「その銘柄が崩れる道筋」を銘柄固有/マクロの両面で列挙して Slack に流す
# (プリモーテムのルールは prompt にベタ書き、数値コンテキストは @ で取り込み、scenario blocks を
# structured_output で返す)。投稿は後続ステップ (post-reply.sh)。**Issue は一切書き換えない**(出力は Slack のみ)。
#
# 起動は Slack 専用。GitHub 画面からの手動実行 (workflow_dispatch) は持たない
# (= config/watchlist.ts の写経先を増やさない。Slack の銘柄ピッカーは Worker が WATCHLIST から
#  動的生成するので写経不要)。
#
# 認証は Claude サブスク (OAuth): ticker-brief.yml と同じ CLAUDE_CODE_OAUTH_TOKEN。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SLACK_WEBHOOK_URL        … 暴落プリモーテムの送り先 (任意、未設定なら通知スキップ)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側の追加設定 (スラッシュコマンド受け口):
#   secret   SLACK_SIGNING_SECRET     … Slack App の Signing Secret (/slack/* の署名検証に必須)
#   GitHub App 認証 (GH_APP_*) は ticker-brief の dispatch と共用。

name: crash-scenario
run-name: crash-scenario ${{ github.event.client_payload.ticker }}

on:
  # Slack /crash → Worker が repository_dispatch で起動する。
  repository_dispatch:
    types: [crash-scenario]

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新しい要求が来たら古いジョブをキャンセルする。
# crash-scenario は Slack に出すだけで状態を持たない (Issueを書かない) ので、キャンセルしても整合は崩れない。
concurrency:
  group: crash-scenario-${{ github.event.client_payload.ticker }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  crash-scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判断の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 数値コンテキスト (earnings/prices/daily/premarket/margin/銘柄コンテキスト) と需給イベント文脈
      # (event_context: SQ/指数リバランス/FOMC/日銀/ピア決算。メジャーSQ unwind や near macro print は
      # 暴落の trigger になりうる) を Worker /judge-context が 1 call で正規化して返す。ticker-brief と
      # 同じエンドポイント (暴落プリモーテムも同じ数値=レンジ位置/MA乖離/信用残/days_to_earnings から
      # fragility を読む)。skill は JSON を Read するだけ。
      - name: Build numeric context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/judge-context?code=${TICKER}" > "$RUNNER_TEMP/numctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload 由来の ticker は run へ生展開せず env 経由で渡す。
          TICKER: ${{ github.event.client_payload.ticker }}

      # プリモーテムのルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる数値
      # コンテキストだけを @ でファイルから取り込む (外部由来 JSON を ${{ }} で prompt に生展開せず
      # YAML 破壊・prompt インジェクションを防ぐ)。ticker は Validate 済みなので prose に展開してよい。
      # skill は @ で読み込んで scenario blocks を structured_output で返すだけ (curl も file write もしない)。
      - name: Run crash-scenario
        id: crash
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker (GitHub App "omnistove-internal-auth") 発の repository_dispatch の actor は
          # その App の Bot になるため許可する。OAuth 経由の claude / 手動の github-actions[bot] も併記。
          allowed_bots: "omnistove-internal-auth,claude,github-actions[bot]"
          prompt: |
            # crash-scenario — ticker ${{ github.event.client_payload.ticker }}

            A **pre-mortem** on this ticker: the stock has broken down six months out — what broke it? Map the
            downside paths only. Never output a trading call or a position action: no buy/sell, no 指値/損切り,
            no hedge or defense to take, no advice verbs. Never write a price level, a drop size, or any other
            figure of your own.

            Judge only on what these inputs show now; never on hindsight or a later result.

            Do not post to Slack; do not run any script; do not write any file — return the scenario blocks as
            structured output and stop.

            ## Inputs

            A block with nothing to report is left out; an absent block means no data — do not mention it.

            **Primary — where the fault lines come from:**

            - **`context_body`**, read in full. Mine it for fault lines, not the bull case. **直近の重大トピック**
              is what the market is pricing now — the most likely thing to disappoint. Absent → say
              `context: unavailable` and build from price, the sector backdrop, and the generic fault lines of
              this 業種.

            **Secondary — raises 確度 or sets the channel; never invents 銘柄固有 risk:**

            - **`market_brief`** (`{ headline, body, date }`): the morning market-wide fact summary, including
              投資部門別 and 空売り比率. Broad weakness in it raises the 確度 of the macro scenarios and shortens
              their trigger horizon. `date` before today → an earlier morning's backdrop; weigh it lightly.
            - **`event_context`**: one-line 需給イベント string `需給イベント(<date>): <…>` (SQ, 指数リバランス,
              nearby macro or peer earnings). An event inside the next few sessions is a trigger candidate; a
              `当銘柄のSQ連動度` well above 1 makes the SQ one; `特になし` → ignore.
            - **`ticker_note`**: qualifies the other inputs; never a scenario of its own.
            - **Metadata** (this ticker in `worker/src/lib/watchlist.ts`: `name`/`sector`/`sector_role`):
              `sector`/`sector_role` set the systematic exposure and which part of the cycle hits first.
            - **Run-up fragility**: `daily.range_pct` (0 = bottom, 100 = top), `ma25_dev_pct`/`ma5_dev_pct`,
              `vol_x_20d`, `margin.ratio` with WoW `long_chg`/`short_chg`. In-session (`market_phase` other than
              `premarket`/`closed`), `daily` is the prior bar — read `daily.vol_x_20d_intraday` for today's 出来高.
              `prices.quote_status: closed` → the tape is not live; do not read a move into it.
            - **Medium-term fragility**: `trend.ma75_dev_pct` and `trend.from_low_52w_pct` (how much gain holders
              could give back), `relative.returns[].excess_pct` (vs TOPIX), `event_reactions.items[]` (a good-news
              disclosure that sold off on `excess_2d_pct` shows exhausted buyers), `valuation.per` against
              `per_range`/`peers` (how much good news the price carries), `revisions.revisions[]` (a `down`
              revision, or a forecast left unchanged into a strong cycle). `sector.rel_strength_pct` / `rank` of
              `peers_n` separates a name-specific run-up from the sector's.
            - **Supply shocks**: `supply.items[]` (売出し/公募/CB/大株主の異動; `lockup_90d`/`lockup_180d` are
              rough dates from the announcement; a `large_holding_change` with `ratio_pct` below `prev_ratio_pct`
              = a large holder selling down) and `short_interest` (`positions.total_ratio_pct` rising =
              institutions building shorts; a running `lending.fee` = squeeze fuel, not a crash path).
              `forced` with a pending 投げ is a supply shock in its stated session.
            - **Scheduled catalysts and macro channels**: `earnings.days_to_earnings`; `premarket.sox_change_pct`
              (overnight semis), `premarket.us10y_change_bp` (米金利上昇), `usdjpy_change` (円高), `vix_price`
              (risk-off). `premarket.status: stale` → weigh lightly; `us_session: carried_over` → a prior close
              the last JP session already traded on, not a fresh sign. `market_phase: premarket` makes a
              tonight→open gap-down its own scenario.

            ## Building the scenarios

            Produce **3–5 scenarios**, ordered most → least pressing (likelihood × severity), covering both
            **銘柄固有** (what breaks this business or stock) and **マクロ** (what drags it down regardless of
            fundamentals). Read the inputs for fragility, not direction, and tie every scenario to a concrete
            input or `context_body`. Each carries きっかけ (a concrete trigger, not a conditional) and 先行サイン
            (what shows before or as it breaks, in inputs the reader can watch). Close with a 総括: which 1–2
            scenarios dominate now, and the single indicator to watch.

            - Reserve `確度:高` for a risk with a fresh trigger or a near-term catalyst; mark tail risks `低`.
            - Rank severity by how far the stock has run (`range_pct`, `ma25_dev_pct`, a structural break), not
              by how alarming the headline reads.
            - For semiconductor names, name which channel the `sector_role` makes break first.
            - A メジャーSQ unwind, a near macro print, or a near 海外SOX系ピア決算 each stands as its own macro
              scenario, with `premarket.sox_change_pct` as a leading sign.

            ## Web research (supplementary)

            The collected inputs are primary. You may use WebSearch/WebFetch to firm up a trigger or 先行サイン
            with 一次情報 (会社 IR/取引所/当局), 海外報道, or アナリスト見解: at most 4 search+fetch calls total; only
            to corroborate a fault line already in the inputs; cite the source (媒体名, 日付) in the scenario
            line; if nothing solid turns up, write nothing — never invent a source.

            ## Output

            Japanese. Each block is one Slack section; the posting step adds the header and bolds each block's
            first line, so do not add `*`.

            - One block per scenario. First line: `<rank>. <name> [<固有 or マクロ>] 確度:<高, 中, or 低>`; then a
              きっかけ line and a 先行サイン line.
            - The last block's first line is exactly `総括`; its body starts on the second line.
          # LLM に curl/sh を叩かせない: 投稿は次ステップが行うので Bash/Write は渡さず
          # Read + WebSearch/WebFetch (追加取材) のみ許可。
          # --json-schema で出力の形を縛る。blocks = scenario + 総括 の Slack section 配列 (各ブロックの中身は prompt の
          # ## Output が定義する。ヘッダブロックは post-reply.sh が前置する)。
          claude_args: >-
            --model opus --effort high --allowedTools Read,WebSearch,WebFetch --max-turns 50
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["blocks"],
              "properties":{
                "blocks":{"type":"array","minItems":2,
                  "items":{"type":"object","additionalProperties":false,"required":["type","text"],
                    "properties":{
                      "type":{"const":"section"},
                      "text":{"type":"object","additionalProperties":false,"required":["type","text"],
                        "properties":{"type":{"const":"mrkdwn"},"text":{"type":"string"}}}}}}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # skill の構造化出力 (structured_output {blocks}) を Slack に投稿する (ヘッダ生成/curl は script が持つ)。
      # name は watchlist.ts から引く (該当 code の直後の name: 行。TS は `name: "...",` 書式)。
      - name: Post crash-scenario to Slack
        run: |
          printf '%s' "$CRASH_JSON" > "$RUNNER_TEMP/crash.json"
          NAME="$(awk -v c="$TICKER" '
            $0 ~ "code:[[:space:]]*\""c"\"," {f=1; next}
            f && $1=="name:" { sub(/^[[:space:]]*name:[[:space:]]*"/,""); sub(/",[[:space:]]*$/,""); print; exit }
          ' worker/src/lib/watchlist.ts)"
          bash scripts/post-reply.sh crash "$TICKER" "$NAME" "$RUNNER_TEMP/crash.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TICKER: ${{ github.event.client_payload.ticker }}
          CRASH_JSON: ${{ steps.crash.outputs.structured_output }}
