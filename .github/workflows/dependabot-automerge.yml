# dependabot の PR を自動マージする。
# このリポジトリは private + free プランで GitHub の auto-merge / branch protection が
# 使えないため、ここで verify を直接回し、成功したら即マージする。
#
# 共通アクション `.github/actions/verify` で品質ゲートを通し、緑なら update-type
# (patch / minor / major) を問わず即マージする。verify が落ちれば当然マージされない。
# マージに必要な write 権限は org/repo の Actions workflow 権限 (write + PR approve可) に依存する。
name: dependabot-automerge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify

      # verify が通ったら即マージ (auto-merge 機能を使わず直接マージ)。
      - name: Merge
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
