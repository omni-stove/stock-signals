# Cloudflare Worker (stock-signals-collector) の自動デプロイ。
#
# main へ worker/ 配下が push されたら wrangler deploy を回す。手動実行 (workflow_dispatch) も可。
# IR取得・prices・eod の cron Trigger は wrangler.toml の [triggers] に定義されており、
# deploy のたびに Cloudflare 側へ反映される (= cron スケジュールも自動更新される)。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret CLOUDFLARE_API_TOKEN   … Cloudflare ダッシュボードで発行した Workers デプロイ用トークン (必須)
#     発行手順: My Profile → API Tokens → Create Token → テンプレ "Edit Cloudflare Workers" を使い、
#     対象アカウント(admin@omnistove.com / account_id 020120735d111b7d06111196719171c1)と
#     対象の D1 / R2 へのアクセスを含めて発行する。account_id は wrangler.toml に記載済みなので不要。
#
# ※ D1 スキーマは drizzle-kit migration で管理する (真の情報源は worker/src/lib/schema.ts)。
#   worker/drizzle/ 配下 (生成された migration SQL) が変更された push のときだけ、deploy 手前で
#   `wrangler d1 migrations apply --remote` する (apply-migrations job)。これは未適用の migration
#   だけを順に流す差分適用なので、既存データ・テーブルは壊れない (DROP 全流しではない)。
#   PK 変更など SQLite 非対応の変更は drizzle-kit が table 再作成手順を生成するので、その migration
#   SQL を事前にレビューしてから push すること。新規 D1 はベースライン登録が要る (worker/README.md 参照)。

name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

# 同一 Worker への deploy が重ならないようにする (新しい push を優先)。
concurrency:
  group: deploy-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # worker/drizzle/ (生成された migration SQL) が変更された push のときだけ、未適用 migration を
  # --remote 差分適用する。migrations apply は適用済みを d1_migrations で追跡し未適用だけ流すので冪等。
  # workflow_dispatch (手動) からも流せるよう、push 以外では常に実行する。
  apply-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          # 直前コミットとの差分で drizzle/ 変更を検出するため2コミット分取る。
          fetch-depth: 2

      - name: Check if migrations changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "手動実行 (${{ github.event_name }}) のため migration を適用します。"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^worker/drizzle/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "worker/drizzle/ が変更されたため migration を適用します。"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "worker/drizzle/ に変更なし。migration 適用をスキップします。"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.changed.outputs.run == 'true'
        with:
          version: latest

      - uses: actions/setup-node@v6
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        # minimumReleaseAge=0 / allowBuilds は worker/pnpm-workspace.yaml に永続設定済み。
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (remote)
        if: steps.changed.outputs.run == 'true'
        run: pnpm exec wrangler d1 migrations apply stock-signals --remote --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    # migration 適用が失敗したまま新コードを deploy すると不整合になりうるので待つ。
    needs: apply-migrations
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install dependencies
        # minimumReleaseAge=0 / allowBuilds は worker/pnpm-workspace.yaml に永続設定済み。
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
