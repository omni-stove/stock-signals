# 新規IR → Claude Code Action で判断 → 銘柄ごとの常設Issue (企業レポート) を更新 → Slack通知。
#
# Worker (Cloudflare) が JST 8:30/12:30/18:30 に IR を取得し D1/R2 に積む。その ~10分後に
# このワークフローが起動し、Worker /pull で「前回カーソル以降の新規IRだけ」を本文込みで引き、
# .claude/skills/ir-report で判断して Issue本文を上書きする。新規0件なら何もしない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SLACK_WEBHOOK_URL        … 判断付き通知の送り先 (任意、未設定なら通知スキップ)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)

name: ir-report

on:
  schedule:
    # GitHub cron は UTC。Worker の IR取得 (JST 8:30/12:30/18:30) の ~10分後に発火。
    - cron: "40 23 * * *" # JST 08:40
    - cron: "40 3 * * *"  # JST 12:40
    - cron: "40 9 * * *"  # JST 18:40
  workflow_dispatch: {}    # 手動実行 (検証用)

# 同時実行を抑止 (cron と手動が重なってもIssue更新が競合しないように)。
concurrency:
  group: ir-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  ir-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ir-report skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 現状 IR取得対応は 285A (キオクシア) のみ。他銘柄のIRパーサが増えたら銘柄を足す。
          prompt: "/ir-report 285A"
          claude_args: "--allowedTools Bash(gh:*),Bash(curl:*),Bash(jq:*),Read --max-turns 30"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
