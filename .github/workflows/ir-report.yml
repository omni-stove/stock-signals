# 新規IR → Claude Code Action で判断 → 銘柄ごとの常設Issue (企業レポート) を更新 → Slack通知。
#
# Worker (Cloudflare) が JST 8:30/12:30/18:30 に IR を取得し、新規があった (written>0) ときだけ
# repository_dispatch (event_type=ir-fetched) でこのワークフローを起動する。新規0件の時刻は
# そもそも起動しないので、LLM (Claude Code Action) は新規があるときしか動かない。
# 起動後は Worker /pull で「前回カーソル以降の新規IRだけ」を本文込みで引き、.claude/skills/ir-report
# で判断して Issue本文を上書きする。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SLACK_WEBHOOK_URL        … 判断付き通知の送り先 (任意、未設定なら通知スキップ)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側 (発火元) は GitHub App (omnistove-internal-auth) で repository_dispatch する。
# Worker Secret に GH_APP_PRIVATE_KEY、wrangler.toml の vars に GH_APP_ID/GH_APP_INSTALL_ID。

name: ir-report

on:
  # Worker が新規IR取得時に叩く。client_payload.tickers に新規があった銘柄が入る。
  repository_dispatch:
    types: [ir-fetched]
  workflow_dispatch: {}    # 手動実行 (検証用)

# 同時実行を抑止 (cron と手動が重なってもIssue更新が競合しないように)。
concurrency:
  group: ir-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  ir-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ir-report skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker発火時は client_payload.tickers に新規があった銘柄が入る。手動実行や
          # payload 無しのときは 285A (現状 IR取得対応は 285A のみ)。
          prompt: "/ir-report ${{ join(github.event.client_payload.tickers, ' ') || '285A' }}"
          # Actions の使い捨てサンドボックス内なので Bash を広く許可 (パイプ/heredoc/tmpfile書き込みが
          # 細かい Bash(gh:*) 指定だと弾かれ、リトライでターンを浪費して失敗していたため)。
          claude_args: "--allowedTools Bash,Write,Read,Edit --max-turns 50"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
