# 朝のマーケットブリーフ → Claude Code Action で市場全体の事実サマリー → Slack通知。
#
# 銘柄非依存の市場全体スキル。ticker-brief (個別の材料ブリーフ) や crash-scenario (個別の下落経路)
# の前に、「前夜と今日の市場全体で何が起きているか」を事実として 1 本にまとめて届ける。
# 地合いラベル (リスクオン/リスクオフ) や売買可否 (拾い場/様子見/守り) は出さない — 判断は読み手が行う。
#
# 起動経路は 2 つ:
#   - repository_dispatch (event_type=market-brief) … Worker の寄り前 intake cron (JST 08:30) が
#       premarket (SOX/NASDAQ/Dow/日経先物) を D1 に取得した「直後」に発火する (worker/src/lib/cron.ts)。
#       市場全体のサマリーなので、同じ寄り前 intake で後段の個別 ticker-brief を撃つより「先」に
#       発火させる (schedule cron で別に撃つと後段より遅れて本末転倒)。
#       JST 土日は cron.ts の isJstWeekend ガードで intake 自体がスキップされるので発火しない。
#       premarket が stale なら skill 側が demote する。
#   - workflow_dispatch … 手動実行 (検証用)。引数なし。
#
# 起動後はブリーフのルールを prompt にベタ書きした Claude Code Action が Worker /market-context の
# 出した市場 JSON (premarket + 需給イベント + セクター内の値動きの広がり) を @ で読み、朝の事実
# サマリーを structured_output で返す。投稿は後続ステップ (post-market.sh)。投稿経路 (/slack/post)
# が headline+body を briefs (ticker='market') に upsert し、judge-context が market_brief として
# 個別ブリーフに同梱する。**このワークフローはコンテキストを一切書き換えない** (出力は Slack のみ)。
#
# 認証・Secret は ticker-brief.yml と同じ:
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# 投稿は skill が Worker /slack/post に投げる (Bot 投稿)。SLACK_BOT_TOKEN 未設定 (503) なら投稿スキップ。

name: market-brief

on:
  repository_dispatch:
    types: [market-brief]    # Worker の寄り前 intake (JST 08:30) が premarket 取得直後に発火する。
  workflow_dispatch: {}      # 手動実行 (検証用)。引数なし。

# 同時実行は 1 本に抑え、走行中に新しい market-brief が来たら古いジョブをキャンセルする。
# ブリーフは Slack に出すだけで状態を持たないのでキャンセルしても整合は崩れない。
concurrency:
  group: market-brief
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  market-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示がブリーフの邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # 市場 JSON (premarket + 需給イベント event_context + セクター内の値動きの広がり) を Worker
      # /market-context が 1 call で正規化して返す。鮮度判定・event 同梱・sectors 集計は Worker 側
      # (決定論的) で行い、skill には curl を叩かせず数値の読解と要約だけをさせる。JSON は複数行・
      # 特殊文字を含むので prompt に直接埋めず、ファイルに書いて skill にパスを渡す。skill は Read するだけ。
      - name: Build market context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/market-context" > "$RUNNER_TEMP/marketctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      # ブリーフのルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる数値コンテキスト
      # だけを @ でファイルから取り込む (外部由来 JSON を ${{ }} で prompt に生展開せず、YAML 破壊と
      # prompt インジェクションを防ぐ)。skill は @ で読み込んだ JSON を要約して structured_output
      # で返すだけ — curl も file write もしない (投稿は次ステップ)。
      - name: Run market-brief
        id: brief
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 起動 actor: repository_dispatch は Worker の GitHub App (omnistove-internal-auth)、
          # 手動 workflow_dispatch は github-actions[bot]。既定では Bot 起動を Action が弾くので両方許可する。
          allowed_bots: "omnistove-internal-auth,github-actions[bot]"
          prompt: |
            # market-brief

            Produce the morning **マーケットブリーフ** — a factual digest of last night and today's setup for
            a human to make their own decisions. Report what moved, how broadly, and what is on today's
            calendar. **Never output a verdict**: no regime label (リスクオン/リスクオフ), no 売買可否
            (拾い場/様子見/守り), no advice verbs. Point at which moves matter most today; leave the conclusion
            to the reader. Never write a figure (%, price, yield, bp, 億円); the posting step appends them.

            Report only what these inputs show now; never hindsight or a later result.

            Do not post to Slack; do not run any script; do not write any file — return structured output
            and stop.

            ## Inputs

            What leads, what only confirms, what to skip:

            - **`market_phase`** (JST trading-day position) frames every other field: `premarket` → the gap
              isn't in yet; 場中 → `sectors` and `live_indexes` are live, read breadth directly; `closed` → report
              today's close plus tonight's NY setup.
            - **`premarket`** is last night's NY session — the primary pre-open input. `sox_change_pct` leads;
              `nasdaq_change_pct` / `dow_change_pct` give breadth, `nikkei_futures_price` the home tape's own gap.
              The macro backdrop: `usdjpy_price` / `usdjpy_change` (円安 lifts exporters), `us10y_yield` /
              `us10y_change_bp` (a rise weighs on high-multiple semis), `vix_price` / `vix_change_pct` (risk
              appetite). `status: stale` → demote it; `unavailable` → report from `sectors` and `event_context`
              alone. `us_session: carried_over` = 米国休場明け — the numbers are the prior close (`date`) the last
              JP session already traded on; say so and do not report them as fresh overnight news.
            - **`us_peers`** (`peers[]`: `ticker`, `role`, `change_pct` for the US session `us_date`) explains
              what drove SOX. Name a peer only when it carries `earnings` or splits from SOX (opposite sign, or a
              much larger move); never list them all. `earnings: after_this_close` → the result is not in
              `change_pct` and the reaction comes in today's session; `in_close` → the close already reflects it.
              `unavailable` → skip.
            - **`live_indexes`**: Asia trading live in the same session — `key` (`nikkei225` = Tokyo's own live
              tape / `kospi` = semis-heavy Korea), `price`, `change_pct`, `status`. `stale` → demote; pre-open
              they are always stale → skip.
            - **`sectors`** is how the watchlist itself moved. Per sector: `backdrop.tone` (SOX-derived),
              `avg_change_pct` (直近営業日のセクター平均前日比), `avg_ret_5d_pct` (5日のトレンド); per name
              `rel_strength_pct` (vs sector avg) and `vol_ratio` (出来高の盛り上がり). `unavailable` → skip.
            - **`event_context`**: one-line 需給イベント string `需給イベント(<date>): <…>` (SQ当日 / SQ週 / SQ明け /
              FOMC / 日銀 近接); a `特になし` tail → ignore.
            - **`market_news`**: recent market-wide theme headlines (`title` / `topic` / `published_at`). Pick
              the 1–2 that bear on today's tape; ignore the rest. Empty → ignore.
            - **`investor_flows`** (weekly 投資部門別, 東証プライム, `net` 買い越し = 正, `week_start`–`week_end`):
              who drove the market last week; `foreigners_streak_weeks` (正 = 連続買い越し, 負 = 連続売り越し).
              Report it only on the morning it is new or when the streak flips. `unavailable` → skip.
            - **`market_short_ratio`** (東証全体の空売り比率 `ratio_pct` on `date`, `avg_5d_pct`): well above its
              5-day average marks heavy hedging and squeeze fuel. `unavailable` → skip.

            ## Output

            Japanese, facts only, no figures.

            - `headline`: `🌅 マーケットブリーフ: <one-phrase summary of last night and today>`.
            - `body`: 3–6 lines. Lead with the strongest fact of the morning. Say whether SOX / NASDAQ /
              日経先物 / live Asia / セクター平均 agree or split — a split tape is worth saying plainly. One line for
              today's calendar when an event fired. Close with the single move or event most worth watching
              today, as a fact to watch, not an instruction. When every input is stale or unavailable, return
              one line saying so instead.

            ## 数値コンテキスト

            @${{ runner.temp }}/marketctx.json
          # LLM に curl/sh を叩かせない: 投稿は次ステップが行うので Bash/Write は渡さず Read のみ許可。
          # --json-schema で出力の形を縛る (= market-brief の構造化スキーマの唯一の定義場所)。
          # headline は自由文 (Worker はパースせず briefs にそのまま保存する)。出力の中身は prompt の ## Output が定義する。
          claude_args: >-
            --model opus --effort high --allowedTools Read --max-turns 30
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["headline","body"],
              "properties":{
                "headline":{"type":"string"},
                "body":{"type":"array","items":{"type":"string"},"minItems":1,"maxItems":6}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # skill の構造化出力 (structured_output) を Slack に投稿する (curl/jq/フォールバックは script が持つ)。
      # /slack/post が kind=market-brief を見て briefs (ticker='market') に upsert する。
      # 第2引数 = LLM に渡したのと同じ marketctx。post-market.sh が 📐 数値 (前夜米国・為替・金利・VIX・
      # 場中指数・空売り比率・投資部門別) を実在値から決定論で組む (LLM は数値を出さない)。
      - name: Post market-brief to Slack
        run: |
          printf '%s' "$MARKET_JSON" > "$RUNNER_TEMP/market.json"
          bash scripts/post-market.sh "$RUNNER_TEMP/market.json" "$RUNNER_TEMP/marketctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          MARKET_JSON: ${{ steps.brief.outputs.structured_output }}
