# 地合い (market regime) チェック → Claude Code Action で リスクオン/中立/リスクオフ判定 → Slack通知。
#
# 銘柄非依存の市場全体スキル。signal-judge (個別の buy/sell) や crash-scenario (個別の下落経路)
# の前段ゲートとして、「今日そもそもエントリーしてよい地合いか」を 1 本のスコアで出す。
#
# 起動経路は 2 つ:
#   - repository_dispatch (event_type=market-check) … Worker の寄り前 intake cron (JST 08:30) が
#       premarket (SOX/NASDAQ/Dow/日経先物) を D1 に取得した「直後」に発火する (worker/src/lib/cron.ts)。
#       地合いは個別 signal-judge の前段ゲートなので、同じ寄り前 intake で後段の signal-judge を撃つ
#       より「先」に発火させる必要がある (schedule cron で別に撃つと後段より遅れて本末転倒)。
#       JST 土日は cron.ts の isJstWeekend ガードで intake 自体がスキップされるので発火しない。
#       premarket が stale なら skill 側が demote する。
#   - workflow_dispatch … 手動実行 (検証用)。引数なし。
#
# 起動後は判定ルールを prompt にベタ書きした Claude Code Action が Worker /market-context の出した
# 地合い JSON (premarket + 需給イベント + セクター内の値動きの広がり) を @ で読み、リスクオン/中立/
# リスクオフと今日の売買可否 (拾い場/様子見/守り) を 1 本にまとめて structured_output で返す。
# 投稿は後続ステップ (post-market.sh)。**このワークフローはコンテキストを一切書き換えない** (出力は Slack のみ)。
#
# 認証・Secret は signal-judge.yml と同じ:
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# 投稿は skill が Worker /slack/post に投げる (Bot 投稿)。SLACK_BOT_TOKEN 未設定 (503) なら投稿スキップ。

name: market-check

on:
  repository_dispatch:
    types: [market-check]    # Worker の寄り前 intake (JST 08:30) が premarket 取得直後に発火する。
  workflow_dispatch: {}      # 手動実行 (検証用)。引数なし。

# 同時実行は 1 本に抑え、走行中に新しい market-check が来たら古いジョブをキャンセルする。
# 地合いは Slack に出すだけで状態を持たないのでキャンセルしても整合は崩れない。
concurrency:
  group: market-check
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  market-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # 地合い JSON (premarket + 需給イベント event_context + セクター内の値動きの広がり) を Worker
      # /market-context が 1 call で正規化して返す。鮮度判定・event 同梱・sectors 集計は Worker 側
      # (決定論的) で行い、skill には curl を叩かせず数値解釈と地合い判定だけをさせる。JSON は複数行・
      # 特殊文字を含むので prompt に直接埋めず、ファイルに書いて skill にパスを渡す。skill は Read するだけ。
      - name: Build market context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/market-context" > "$RUNNER_TEMP/marketctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      # 判定ルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる数値コンテキスト
      # だけを @ でファイルから取り込む (外部由来 JSON を ${{ }} で prompt に生展開せず、YAML 破壊と
      # prompt インジェクションを防ぐ)。skill は @ で読み込んだ JSON を地合い判定して structured_output
      # で返すだけ — curl も file write もしない (投稿は次ステップ)。
      - name: Run market-check
        id: check
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 起動 actor: repository_dispatch は Worker の GitHub App (omnistove-internal-auth)、
          # 手動 workflow_dispatch は github-actions[bot]。既定では Bot 起動を Action が弾くので両方許可する。
          allowed_bots: "omnistove-internal-auth,github-actions[bot]"
          prompt: |
            # market-check

            Read **the room, not a name**: one honest call on today's backdrop. The 前段ゲート for whether
            today's tape favors acting at all. The notes below say where the inputs mislead; commit to one read.

            ## Inputs

            The numeric context JSON is embedded inline below. Do not post to Slack; do not run any script; do
            not write any file — return your call as
            structured output and stop. Judge only on what these inputs show now; never on hindsight or a later
            result. When every field is stale or unavailable, return `中立`.

            How to read the fields (what leads, what confirms):

            - **`premarket`** is last night's NY tell — the strongest single input pre-open, lead on it.
              `sox_change_pct` leads this semis-heavy watchlist; `nasdaq_change_pct` / `dow_change_pct` give
              breadth, `nikkei_futures_price` the home tape's own gap. `status: stale` → demote it; `unavailable`
              → call on `sectors` + event alone. `us_session: carried_over` = 米国休場明け — the numbers are the
              prior close (`date`) that the last JP session already traded on; treat premarket as no new tell and
              lead on `nikkei_futures_price` / `live_indexes` / `sectors` instead.
            - **`live_indexes`** is Asia trading live in the same session — the場中 counterpart to `premarket`'s
              overnight tell. Each entry: `key` (`nikkei225` = Tokyo's own live tape / `kospi` = semis-heavy Korea,
              Samsung / SK hynix), `price`, `change_pct`, `status` (`ok` / `stale` = older than 1h → demote).
              `unavailable` or all stale → lean on `premarket` + `sectors`. Pre-open (`market_phase: premarket`)
              they haven't opened → expect stale.
            - **`sectors`** is how the watchlist itself moved; confirms or contradicts the premarket tilt. Per
              sector: `tone` (SOX-derived backdrop), `avg_change_pct` (直近営業日のセクター平均前日比),
              `avg_ret_5d_pct` (5日のトレンド); per-name `rel_strength_pct` (relative strength vs sector avg)
              and `vol_ratio` (出来高の盛り上がり). Missing or empty → lean on `premarket` + event alone.
            - **`event_context`**: one-line 需給イベント string `需給イベント(<date>): <…>` (SQ週 / SQ明け / FOMC /
              日銀 近接); a `特になし` tail means no event fired — ignore it.
            - **`market_news`**: recent market-wide theme headlines not tied to a watchlist name, each with
              `title` / `topic` (`semi`/`ai`/`rates`/`us`/`market`) / `published_at`. Material that colors the tilt, not
              a driver of it: a headline aligned with the premarket/sectors lean confirms; one that cuts against
              a strong tape is unpriced 逆風, pulling toward 様子見. Empty array → ignore.
            - **`market_phase`** (JST trading-day position) frames what the numbers mean: `premarket` (lead on
              `premarket`/event, the gap isn't in yet), `morning_session` / `afternoon_session` / `lunch_break`
              (場中 — `sectors` is live, read breadth directly), `closed` (引け後 — react to today's close plus
              tonight's NY setup).

            ## Forming the call

            These are the forces; weigh them into one read, don't match them to a label.

            **`premarket` sets the tilt; `sectors` confirms or contradicts it.** SOX, NASDAQ, and 日経先物 all
            leaning down together is a clean リスクオフ. SOX weak while Dow / NASDAQ hold is sector-specific
            逆風, not broad — リスクオフ寄りの中立, semis に限った守り. When `sectors` already shows the watchlist
            heavy (`avg_ret_5d_pct` deep negative, vol swelling) the move is underway, which deepens リスクオフ
            even on a flat premarket.

            **Breadth matters more than any single index.** One index down is noise; SOX, NASDAQ, 日経先物,
            live KOSPI / 日経225, and セクター平均 all leaning the same way is signal. Overnight (premarket) and
            live Asia (live_indexes) agreeing is the strongest confirmation; live Asia cutting against a flat
            premarket is the session repricing — trust the live read. A split tape is 中立 — the most honest call
            on most days; don't manufacture a regime that isn't there.

            **Events cap the aggressiveness, not the direction.** A near FOMC / 日銀 or SQ週 doesn't make the day
            risk-off by itself — it argues for 様子見 / 持ち越しを軽く regardless of which way the tilt points. A
            strong リスクオン tape into a binary event is still 拾うなら軽く, not 全力.

            ## 数値コンテキスト

            @${{ runner.temp }}/marketctx.json
          # LLM に curl/sh を叩かせない: 投稿は次ステップが行うので Bash/Write は渡さず Read のみ許可。
          # --json-schema で出力の形を縛る (= market-check の構造化スキーマの唯一の定義場所)。
          # headline = 地合いゲート行 (🌐 地合い: <regime>・<含意>)、body = Slack 本文 2〜4 行。
          claude_args: >-
            --model opus --effort high --allowedTools Read --max-turns 30
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["headline","body"],
              "properties":{
                "headline":{"type":"string","description":"地合いゲート行。exact format で verbatim: 🌐 地合い: <リスクオン|中立|リスクオフ>・<拾い場|様子見|守り> — regime (リスクオン|中立|リスクオフ) を1つ選び、それ+events が 売買可否の含意 (拾い場|様子見|守り) を決める。signal-judge/crash-scenario が地合いゲートとしてパースする"},
                "body":{"type":"array","items":{"type":"string"},"minItems":1,"maxItems":4,"description":"Slack 本文 2〜4 行 (日本語): premarket tilt (SOX/NASDAQ/日経先物) と場中の live 日経225/KOSPI・breadth が揃うか、近接イベントの caveat、売買可否の理由 1 行"}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # skill の構造化出力 (structured_output) を Slack に投稿する (curl/jq/フォールバックは script が持つ)。
      - name: Post market-check to Slack
        run: |
          printf '%s' "$MARKET_JSON" > "$RUNNER_TEMP/market.json"
          bash scripts/post-market.sh "$RUNNER_TEMP/market.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          MARKET_JSON: ${{ steps.check.outputs.structured_output }}
