# 寄り前ブリーフ: 毎朝 寄り付き前に「今日の地合い+各銘柄の傾き」を Claude Code Action で
# まとめ、Slack に1本ポストする。
#
# context-builder.yml / signal-judge.yml が repository_dispatch 駆動なのに対し、こちらは GitHub Actions cron 駆動。
# 平日 JST 08:30 (= UTC 23:30) に起動する。kehai(寄前気配)は使わず、前夜に確定済みの
# 地合い(米国指数 SOX/Nasdaq/Dow + 日経先物)と各銘柄の daily/prices/fundamentals だけを
# 見るので、寄り付き(09:00)前のどの時刻でも成立する。
#
# 起動時にまず Worker の /run?kind=premarket を叩いて当日分の地合いを D1 に取らせ
# (米国指数3本+先物だけなので数秒)、直後に /premarket-brief skill が /latest?kind=premarket で
# それを読む。これで「取得とブリーフが同時に走って古い値を読む」レースを避ける。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SLACK_WEBHOOK_URL        … ブリーフの送り先 (任意、未設定なら通知スキップ)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
#
# 注意: GitHub Actions の scheduled workflow は main(デフォルトブランチ)でのみ動作する。
#   混雑時は数分の遅延・スキップがありうるが、寄り前ブリーフは多少ずれても許容。

name: premarket-brief

on:
  schedule:
    # UTC 固定。23:30 UTC = JST 08:30。平日 (月-金) のみ。
    # (GitHub Actions の cron は timezone 指定のサポートが不安定なため UTC で書く)
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {} # 手動実行 (検証用)

# 同時実行を抑止 (cron と手動が重なっても二重ポストしないように)。
concurrency:
  group: premarket-brief
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  premarket-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ブリーフが読む前に当日の地合いを D1 に取らせる (レース回避)。
      # 取得失敗時もブリーフは前日値で続行できるよう、ここでは job を落とさない。
      - name: Refresh premarket backdrop (Worker)
        run: |
          curl -s -m 60 -H "Authorization: Bearer ${SYNC_TOKEN}" "${WORKER_URL}/run?kind=premarket" || echo "premarket refresh failed (continuing with existing data)"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Run premarket-brief skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/premarket-brief"
          # Actions の使い捨てサンドボックス内なので Bash を広く許可 (context-builder と同じ理由)。
          claude_args: "--allowedTools Bash,Write,Read,Edit --max-turns 50"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
