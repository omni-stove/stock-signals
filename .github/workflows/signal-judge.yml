# 銘柄コンテキスト + 価格/地合い → Claude Code Action でスイング判定 → Slack通知。
#
# 2段アーキテクチャの後段。前段 context-builder が銘柄の持続コンテキストを更新したあと、
# repository_dispatch (event_type=signal-judge、client_payload.ticker に単一銘柄) でこのワークフローを
# 起動する。手動でも実行できる。
#
# 起動後は判定ルールを prompt にベタ書きした Claude Code Action が対象銘柄の数値コンテキスト
# (context-builder が育てたコンテキスト本文 + Worker /judge-context の価格/日足/地合い/決算日/信用残)
# を @ で読み、buy/sell の方向を1本にまとめて structured_output で返す。投稿は後続ステップ
# (post-signal.sh)。**このワークフローはコンテキストを一切書き換えない**(出力は Slack のみ)。
# context-builder がコンテキストを書き、signal-judge が Slack を書く、という役割の固定により、
# judge → context の編集ループは発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# 判定通知は skill が Worker /slack/post に投げる (Bot 投稿)。Worker 側の追加設定:
# SLACK_BOT_TOKEN / SLACK_REPLY_CHANNEL。未設定 (503) なら投稿スキップ。
# 発火元 (context-builder) は github.token (GITHUB_TOKEN) で repos/.../dispatches を叩く。

name: signal-judge

on:
  # context-builder がコンテキストを更新したあとに銘柄ごとに叩く。
  repository_dispatch:
    types: [signal-judge]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード
        required: true
        type: choice
        # worker/src/lib/watchlist.ts の TICKERS と同期させる。
        # 下の options は `npm run gen:watchlist` が自動生成する (手で編集しないこと)。
        options:
          # GEN:watchlist:start
          - "285A"  # キオクシアホールディングス
          - "6857"  # アドバンテスト
          - "6920"  # レーザーテック
          - "6976"  # 太陽誘電
          - "6981"  # 村田製作所
          # GEN:watchlist:end

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新しい judge 要求が来たら古いジョブをキャンセルする。
# signal-judge は Slack に出すだけで状態を持たない (Issueを書かない) ので、キャンセルしても整合は崩れない。
concurrency:
  group: signal-judge-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  signal-judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload/inputs.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 数値コンテキスト (earnings/prices/daily/premarket/margin/銘柄コンテキスト) と需給イベント文脈
      # (SQ/指数リバランス/FOMC/日銀/ピア決算) を Worker /judge-context が 1 call で正規化して返す。
      # 鮮度判定・20日レンジ位置・MA位置・出来高倍率・days_to_earnings・market_phase・event_context は
      # すべて Worker 側 (決定論的) で算出済み。skill には curl を叩かせず数値解釈と判断だけをさせる。
      # JSON は複数行・特殊文字を含むので prompt に直接埋めず、ファイルに書いて skill にパスを渡す。
      #
      # 指数リバランス窓 (/index-rebalance) は judge=LLM の方向判断には渡さない観測事実なので、
      # numctx.json とは**別ファイル** (rebalance.json) に保存する。同じファイルに混ぜると skill に
      # 余計なリバランス情報が渡ってしまうため、保存場所を情報ごとに分ける。両 curl は依存が無いので
      # & で並行に走らせ、wait で揃える (judge-context のレイテンシに相乗りで実質ゼロコスト)。
      # リバランスは窓外なら note が空になり、post-signal.sh 側で何も貼らない。fetch 失敗は空ファイル。
      - name: Build numeric context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/judge-context?code=${TICKER}" > "$RUNNER_TEMP/numctx.json" &
          numctx_pid=$!
          # リバランスは judge に必須でない観測事実。fetch 失敗でも judge を止めず空ファイルで続ける。
          ( curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
              "${WORKER_URL%/}/index-rebalance" > "$RUNNER_TEMP/rebalance.json" || : > "$RUNNER_TEMP/rebalance.json" ) &
          rebal_pid=$!
          # judge-context は必須。失敗したらここで落とす。リバランスは結果を問わず待つだけ。
          wait "$numctx_pid"
          wait "$rebal_pid" || true
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload/inputs 由来の ticker は run へ生展開せず env 経由で渡す。
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}

      - name: Run signal-judge
        id: judge
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # context-builder 発の repository_dispatch を許可する。context-builder は OAuth
          # (claude_code_oauth_token) で走るため、その中から叩く dispatch の actor は
          # github-actions[bot] ではなく claude (type: Bot) になる。手動/github.token 経由の
          # github-actions[bot] も許すため両方を列挙する。既定では Bot起動を Action が弾く。
          # Slack スラッシュコマンド /signal 経由は Worker (GitHub App "omnistove-internal-auth")
          # 発の dispatch なので、その App の Bot も許可する (slack-reply.yml と同じ)。
          allowed_bots: "omnistove-internal-auth,claude,github-actions[bot]"
          # 判定ルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる数値コンテキスト
          # だけを @ でファイルから取り込む (外部由来 JSON を ${{ }} で prompt に生展開せず YAML 破壊・
          # prompt インジェクションを防ぐ)。ticker は Validate 済みなので prose に展開してよい。
          prompt: |
            # signal-judge — 対象銘柄 ${{ github.event.client_payload.ticker || inputs.ticker }}

            Judge the market side only — a buy or a sell at this level — and output a **direction** plus a
            **price line**, never a 動詞. The reader maps `sell`→利確/損切り, `buy`→新規/増し玉 against their own
            position; do not choose that verb for them.

            Judge on what you can see now — context, numbers, `event_context` — never on hindsight ("priced in,"
            "unexplained" volume, a top being "in"). "after it falls further" / "once it settles" is not a verdict;
            tomorrow's open, next week, the quarter ahead never decide.

            Default `exec: now`. Take `exec: wait` only when an anchor — `daily.ma5` / `daily.ma25` / the
            20日 range edge (buy: low, sell: high) — sits on the entry side of the reference price (last trade;
            `quote_status: closed` → `daily.close`) within 1.5×`atr_pct`, and put that anchor's value in `line`.
            The posting step snaps `line` to the nearest such anchor and demotes to `now` when none qualifies —
            any other number does not survive. `stop` beyond `line`, never equal. 過熱・地合い・不確実性・
            予想される投げ/踏み tighten the 損切り or size, not the entry. When waiting, name the anchor in
            the body.

            ## Inputs

            How to read the fields (what to lead on, what to ignore):

            - **`context_body`** carries three layers: 直近の重大トピック (freshest), older structural context,
              証券会社レーティング (6–12mo, weight by 発行日 / アップサイド% / 信頼度). Null → emit
              `context: unavailable` and call on price alone.
            - **`market_regime`** (`{ regime, stance, headline }`): the day's 地合い call (リスクオフ/中立/リスクオン).
            - **`prices`**: ignore `pts_price`; use `change_pct`/`volume`/`quote_time`/`slot` (`slot` =
              `premarket`/`regular`/`closing`). `quote_status: closed` → stale tape, demoted to backdrop.
            - **`market_phase`** (JST trading-day position) says what to lead on: `premarket` → lead on
              `premarket`/context (digesting overnight NY); `afternoon_session` with a live tape → lead on the
              live tape, a pre-close call on carrying overnight into tomorrow; `closed` → react to the close.
              - **During the session** (`morning_session`/`lunch_break`/`afternoon_session`) `daily` has no
                confirmed bar for today yet, so `daily.latest_date` is the **prior** trading day and `vol_x_20d` /
                `range_pct` / MA乖離 are all on that prior bar — do not read them as today's. For 出来高 use
                `daily.vol_x_20d_intraday` (today's cumulative volume pace-projected to a full day ÷ 20日平均);
                null near the open means too little has traded to project. After `closed`, `vol_x_20d` is the
                confirmed value again and `vol_x_20d_intraday` is null.
            - **`premarket`** (prior NY session): `sox_change_pct` is the overnight external backdrop moving the 水準
              — `sector` leads over it; `nasdaq_change_pct` / `dow_change_pct` / `nikkei_futures_price` only confirm.
              `us_session: carried_over` = the US was closed overnight (休場明け) and these numbers are the prior
              close (printed `us_close_jst_date`) that the previous JP session already traded on — treat as no new
              overnight information, don't re-weight it.
            - **`valuation`** (`{ per_now, fair_per, vs_fair }`): `vs_fair` is the 実績PER vs 妥当PER read —
              `above`/`inline`/`below`.
            - **`event_context`**: one-line 需給イベント string `需給イベント(<date>): <…>`; a `特になし` tail
              means no event fired — ignore it.
            - **`sector`** (`{ backdrop, avg_ret_5d_pct, rows }`, null → skip): peer tape, `rows` sorted 相対強弱の強い順.
              This ticker's `rel_strength_pct` (its 5日リターン − セクタ平均) is the sector read — lead on it over SOX.
            - **`ticker_note`**: qualifies the other inputs, never sets direction.
            - the ticker's `name`/`sector` are in `worker/src/lib/watchlist.ts`.
            - Skip any block whose `status` is `insufficient`/`stale`/`unavailable`.

            ## Forming the call

            ### Primary — sets the direction

            - **`context_body`** is the heart of the call. Fresh corroborating topics in 直近の重大トピック (or a
              just-released earnings/guidance) set the strongest direction; a thin single line still picks a side,
              noted as thin; nothing materially new weakens the case. 証券会社レーティング only corroborates.
              `sector` corroborates too: a name leading its peers backs a topic-driven buy, lagging discounts it.

            ### Secondary — moves the 水準 only

            Name in the body how each force that fired moved the 水準.

            **地合い (`market_regime` gate):**

            - リスクオフ bars 追い and floors the 損切り (size down, tighten); 中立 grants no boost; リスクオン
              permits the fuller 水準.

            **過熱 (how stretched the move is):**

            - **How far the move has run** → tighter (higher buy line, shallower add). `valuation.vs_fair`:
              `above` picks the nearer in-band anchor, `below` the lower one.
            - **Overbought** argues against adding, not holding.
              `daily.momentum_state`: `extended` = trend still working, `cracking` = turn toward exiting (so is
              the driving topic dropping out of 直近の重大トピック). The gate sets how hard it bites — リスクオン
              reads `extended` as the trend working, リスクオフ as the first 投げ; name which regime set the read.
              Read `atr_pct` cross-sectionally against the sector when `atr_pct_baseline` is null.
            - **`daily.volume_quality`** on an 出来薄 up move: `accumulation` holds the 水準, `thin` tightens it,
              `mixed`/`na` lean neither way. Works the 過熱 read only.

            **需給 (positioning / flow):**

            - **Margin** contradicting the context → soften the 水準 one step.
            - **`forced`** (status `none` → skip): `summary` already states the forced-flow timing
              (投げ/踏み, ~何営業日後のどのセッション, building=これから / exhausted=出尽くし); take it as given.
              A pending flush argues for `wait` at an in-band anchor and a 損切り beyond the flush — never a
              `line` below the band. Never sets direction.
            - **Event context** — SQ週/メジャーSQ unwind distorts the tape (noise, fall back to fundamentals);
              SQ明け is clean; 米メジャーSQ reaches JP only via SOX. 海外ピア決算: `あとX日で` = pending, soften one
              step; `通過済み` = already in `premarket`/`sector`, do not re-weight. Never override context_body on a
              settled peer print.

            **イベントリスク (binary events):**

            - **Earnings near** is binary-event risk → tighter (smaller size, tighter 損切り); cannot set
              direction. **Just out** (`earnings_result.status: fresh`): `verdict`
              tilts one step — `beat` toward holding/adding, `miss` toward exiting; `inline` and non-`fresh` add
              nothing. Near or just-out, read the price reaction through **## 決算の特色・クセ** (the name may
              move on a metric other than EPS).

            ## 数値コンテキスト

            @${{ runner.temp }}/numctx.json
          # --json-schema で出力の形を縛る (= signal-judge の構造化スキーマの唯一の定義場所)。
          # side/line/stop/rr が機械可読な判定、headline/body が同じ判定の Slack 表示用日本語。
          # 検証済み JSON は steps.judge.outputs.structured_output で受ける。skill には curl/sh を
          # 叩かせない (投稿/保存は次ステップ): Bash は渡さず Read のみ許可、ファイルも書かせない。
          claude_args: >-
            --model opus --effort high --allowedTools Read --max-turns 40
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["side","exec","line","stop","rr","headline","body"],
              "properties":{
                "side":{"enum":["buy","sell"],"description":"market side: buy=買い場 / sell=売り場, one direction"},
                "exec":{"enum":["now","wait"],"description":"now=現値約定 / wait=line で指値待ち"},
                "line":{"type":["number","null"],"description":"limit price for wait (an anchor value; the posting step snaps it to the nearest data anchor); null when now"},
                "stop":{"type":["string","null"],"description":"損切りライン (price or MA/range expression); null if none"},
                "rr":{"enum":["良","可","薄"],"description":"リスクリワード read from upside-to-損切り"},
                "headline":{"type":"string","description":"Slack first line, exact format verbatim: 🧭 <ticker> <name> signal: <buy|sell> (now|wait@<line>; 損切り=<line> / RR<良|可|薄>)"},
                "body":{"type":"array","items":{"type":"string"},"minItems":1,"maxItems":3,"description":"Slack body, 1-3 lines in Japanese: driving topics, price/backdrop/earnings tilt, why this line (a 需給 line if 信用残 mattered, how the gate moved the 水準), the 損切り/RR read; never contradict the structured fields"}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # skill の構造化出力 (structured_output) を Slack に投稿し、判定を Worker に保存する
      # (curl/jq/blocks 組み立て/フォールバックは script が持つ)。第2引数 = 判定 JSON、
      # 第3引数 = 前段で並行取得した指数リバランス窓の JSON (judge には渡していない観測事実)。
      # 第4引数 = judge に渡したのと同じ numctx。post-signal.sh の押し目ガード (wait の指値が
      # 参照価格から 1.5×ATR% 超乖離 or 判定方向と逆側なら now に降格) の参照価格/ATR に使う。
      - name: Post signal to Slack
        run: |
          printf '%s' "$SIGNAL_JSON" > "$RUNNER_TEMP/signal.json"
          bash scripts/post-signal.sh "$TICKER" "$RUNNER_TEMP/signal.json" "$RUNNER_TEMP/rebalance.json" "$RUNNER_TEMP/numctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          SIGNAL_JSON: ${{ steps.judge.outputs.structured_output }}
