# 銘柄コンテキスト + 価格/地合い → Claude Code Action でスイング判定 → Slack通知。
#
# 2段アーキテクチャの後段。前段 context-builder が銘柄の持続コンテキストを更新したあと、
# repository_dispatch (event_type=signal-judge、client_payload.ticker に単一銘柄) でこのワークフローを
# 起動する。手動でも実行できる。
#
# 起動後は .claude/skills/signal-judge が対象銘柄のコンテキスト(context-builder が育てたもの)を
# 読み、Worker /latest で価格/日足/地合い/決算日/信用残を引いて buy/sell の方向を1本にまとめ、
# Slack に通知する。**このワークフローはコンテキストを一切書き換えない**(出力は Slack のみ)。
# context-builder がコンテキストを書き、signal-judge が Slack を書く、という役割の固定により、
# judge → context の編集ループは発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# 判定通知は skill が Worker /slack/post に投げる (Bot 投稿)。Worker 側の追加設定:
# SLACK_BOT_TOKEN / SLACK_REPLY_CHANNEL。未設定 (503) なら投稿スキップ。
# 発火元 (context-builder) は github.token (GITHUB_TOKEN) で repos/.../dispatches を叩く。

name: signal-judge

on:
  # context-builder がコンテキストを更新したあとに銘柄ごとに叩く。
  repository_dispatch:
    types: [signal-judge]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード
        required: true
        type: choice
        # config/watchlist.yaml の tickers と同期させる。
        options:
          - "285A"  # キオクシアホールディングス
          - "6857"  # アドバンテスト
          - "6920"  # レーザーテック
          - "6981"  # 村田製作所

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新しい judge 要求が来たら古いジョブをキャンセルする。
# signal-judge は Slack に出すだけで状態を持たない (Issueを書かない) ので、キャンセルしても整合は崩れない。
concurrency:
  group: signal-judge-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  signal-judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # SQ (日本/米メジャー)・指数リバランスは GNU date で計算し、FOMC/日銀は Worker
      # /latest?kind=macro-events (D1) から取得して近接イベントを 1 行に整形し prompt に渡す。
      # skill 本体にはカレンダーを読ませない方針 (決定論的な算出は step 側で完結)。
      # 起動経路 (dispatch / 手動) によらずここで毎回算出するので payload には依存しない。
      - name: Build event context
        run: bash scripts/event-context.sh > "$RUNNER_TEMP/eventctx.txt"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      # Worker の数値データ (earnings/prices/daily/premarket/margin) と銘柄コンテキストを fetch +
      # 正規化し、1 つの JSON にまとめて prompt に渡す。鮮度判定・20日レンジ位置・MA位置・出来高倍率・
      # days_to_earnings はここ (決定論的) で計算し、コンテキスト本文は context_body として同梱する。
      # skill には curl を叩かせず数値解釈と判断だけをさせる。JSON は複数行・特殊文字を含むので prompt に
      # 直接埋めず、ファイルに書いて skill にパスを渡す。skill はそのファイルを Read するだけ。
      - name: Build numeric context
        run: |
          ticker="${{ github.event.client_payload.ticker || inputs.ticker }}"
          bash scripts/judge-context.sh "$ticker" > "$RUNNER_TEMP/numctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Run signal-judge skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # context-builder 発の repository_dispatch を許可する。context-builder は OAuth
          # (claude_code_oauth_token) で走るため、その中から叩く dispatch の actor は
          # github-actions[bot] ではなく claude (type: Bot) になる。手動/github.token 経由の
          # github-actions[bot] も許すため両方を列挙する。既定では Bot起動を Action が弾く。
          allowed_bots: "claude,github-actions[bot]"
          # 発火時は client_payload.ticker、手動実行時は inputs.ticker。@ で始まる 2 引数は
          # 需給イベント文脈と数値コンテキスト(コンテキスト本文同梱)のファイルパス。skill は両方を
          # Read するだけ。自由文字列を prompt に素埋めしないことで -- / @ の衝突を避ける。
          prompt: "/signal-judge ${{ github.event.client_payload.ticker || inputs.ticker }} @${{ runner.temp }}/eventctx.txt @${{ runner.temp }}/numctx.json"
          # Actions の使い捨てサンドボックス内なので Bash を広く許可。numctx.json を read するため Read も許可。
          claude_args: "--model opus --effort high --allowedTools Bash,Read --max-turns 40"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
