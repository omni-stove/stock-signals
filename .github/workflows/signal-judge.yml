# 銘柄コンテキスト(Issue本文)+ 価格/地合い → Claude Code Action でスイング判定 → Slack通知。
#
# 2段アーキテクチャの後段。前段 context-builder が銘柄の Issue本文(持続コンテキスト)を更新したあと、
# repository_dispatch (event_type=signal-judge、client_payload.ticker に単一銘柄) でこのワークフローを
# 起動する。手動でも実行できる。
#
# 起動後は .claude/skills/signal-judge が対象銘柄の Issue本文(context-builder が育てたコンテキスト)を
# 読み、Worker /latest で価格/日足/地合い/決算日を引いて buy/sell の方向を1本にまとめ、
# Slack に通知する。**このワークフローは Issue を一切書き換えない**(出力は Slack のみ)。
# context-builder が Issue本文を書き、signal-judge が Slack を書く、という役割の固定により、
# judge → context の編集ループは発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SLACK_WEBHOOK_URL        … 判定通知の送り先 (任意、未設定なら通知スキップ)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# 発火元 (context-builder) は github.token (GITHUB_TOKEN) で repos/.../dispatches を叩く。

name: signal-judge

on:
  # context-builder が Issue本文(コンテキスト)を更新したあとに銘柄ごとに叩く。
  repository_dispatch:
    types: [signal-judge]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード (例 285A)
        required: true
        type: string

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新しい judge 要求が来たら古いジョブをキャンセルする。
# signal-judge は Slack に出すだけで状態を持たない (Issueを書かない) ので、キャンセルしても整合は崩れない。
concurrency:
  group: signal-judge-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read     # Issue本文(コンテキスト)を読むだけ。書き込みはしない。
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  signal-judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Action 実行時は CLAUDE.md の指示が判定の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # SQ (日本/米メジャー) と config/events.yaml の近接イベントを 1 行に整形し、prompt に渡す。
      # skill 本体にはカレンダーを読ませない方針 (決定論的な算出は step 側=GNU date で完結)。
      # 起動経路 (dispatch / 手動) によらずここで毎回算出するので payload には依存しない。
      - name: Build event context
        id: events
        run: echo "ctx=$(bash scripts/event-context.sh)" >> "$GITHUB_OUTPUT"

      # Worker の数値データ (earnings/prices/daily/premarket) を fetch + 正規化し、1 つの JSON に
      # まとめて prompt に渡す。鮮度判定・20日レンジ位置・MA位置・出来高倍率・days_to_earnings は
      # ここ (決定論的) で計算し、skill には curl を叩かせず数値解釈と判断だけをさせる。
      # Issue 本文 (コンテキスト) は巨大かつ正規化不要なので skill が直接 gh で読む (このstepの対象外)。
      # JSON は複数行・特殊文字を含むので prompt に直接埋めず、ファイルに書いて skill に
      # パスを渡す。skill はそのファイルを Read するだけ (curl を叩かない)。
      - name: Build numeric context
        run: |
          ticker="${{ github.event.client_payload.ticker || inputs.ticker }}"
          bash scripts/judge-context.sh "$ticker" > "$RUNNER_TEMP/numctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Run signal-judge skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # context-builder 発の repository_dispatch を許可する。context-builder は OAuth
          # (claude_code_oauth_token) で走るため、その中から叩く dispatch の actor は
          # github-actions[bot] ではなく claude (type: Bot) になる。手動/github.token 経由の
          # github-actions[bot] も許すため両方を列挙する。既定では Bot起動を Action が弾く。
          allowed_bots: "claude,github-actions[bot]"
          # 発火時は client_payload.ticker に対象銘柄が入る。手動実行時は inputs.ticker を使う。
          # 第2引数に需給イベント文脈 (SQ含む) を渡す。skill はこれを入力として解釈する。
          # 第2引数に需給イベント文脈 (SQ含む)、@ で始まる第3引数に数値コンテキスト JSON の
          # パスを渡す。skill は JSON を Read し、Issue 本文だけ gh で読む。
          prompt: "/signal-judge ${{ github.event.client_payload.ticker || inputs.ticker }} -- ${{ steps.events.outputs.ctx }} @${{ runner.temp }}/numctx.json"
          # Actions の使い捨てサンドボックス内なので Bash を広く許可。numctx.json を read するため Read も許可。
          claude_args: "--model opus --allowedTools Bash,Read --max-turns 40"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
