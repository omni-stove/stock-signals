# Slack スレッド返信 → 銘柄コンテキスト+価格/市場状況+スレッド履歴 → Claude Code Action で
# 返答生成 → 同じ Slack スレッドへ投稿。
#
# ticker-brief / crash-scenario が Bot トークン (Worker /slack/post) で投稿した解析結果に、
# ユーザーがスレッド返信すると、Worker の /slack/events が thread_ts→銘柄を D1 で復元して
# repository_dispatch (event_type=slack-reply) で起動する。client_payload に
# ticker / kind(元の解析種別) / channel / thread_ts / text(ユーザーの返信本文) が入る。
# このワークフローは Issue を一切書き換えない (出力は Slack スレッドのみ)。
#
# 起動は Slack 専用 (GitHub 画面からの手動実行は持たない = watchlist.ts の写経先を増やさない)。
#
# 認証は Claude サブスク (OAuth): ticker-brief.yml と同じ CLAUDE_CODE_OAUTH_TOKEN。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SLACK_BOT_TOKEN          … xoxb- トークン。スレッド履歴取得 (conversations.replies) に必須
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側の追加設定: SLACK_BOT_TOKEN / SLACK_REPLY_CHANNEL / SLACK_SIGNING_SECRET。
#   GitHub App 認証 (GH_APP_*) は ticker-brief の dispatch と共用。

name: slack-reply

on:
  # Slack スレッド返信 → Worker /slack/events が repository_dispatch で起動する。
  repository_dispatch:
    types: [slack-reply]

# スレッドごとに同時実行を1本に抑え、走行中に同じスレッドへ続けて返信が来たら古いジョブを
# キャンセルする (最新の返信に答えればよい)。Slack に出すだけで状態を持たないので整合は崩れない。
concurrency:
  group: slack-reply-${{ github.event.client_payload.thread_ts }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  slack-reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判断の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 数値コンテキスト (earnings/prices/daily/premarket/margin/銘柄コンテキスト/event_context) を
      # Worker /judge-context が 1 call で正規化して返す。ticker-brief と同じエンドポイント。
      - name: Build numeric context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/judge-context?code=${TICKER}" > "$RUNNER_TEMP/numctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload 由来の値は ${{ }} で run/jq/prompt に生展開せず env 経由で渡す
          # (Slack ユーザーの自由入力が Worker 経由で透過してくるためインジェクション対策)。
          TICKER: ${{ github.event.client_payload.ticker }}

      # スレッド文脈 (会話履歴 + 返信先) を Worker /thread-context が 1 call で返す。
      # conversations.replies の取得・整形・ok:false フォールバック・payload text の末尾追加は
      # すべて Worker 側 (決定論的) で行い、skill には curl を叩かせず Read させるだけにする
      # (judge-context / market-context / context-input と同じ方針)。出力は
      # { channel, thread_ts, kind, replies: [{user,text,ts}, ...] }。
      # payload 由来の値 (Slack ユーザーの自由入力が透過してくる) は --data-urlencode で
      # クエリにエンコードして渡す (run/prompt への ${{ }} 生展開を排除)。
      - name: Build thread context
        run: |
          curl -fsS -G "${WORKER_URL%/}/thread-context" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            --data-urlencode "channel=${CHANNEL}" \
            --data-urlencode "thread_ts=${THREAD_TS}" \
            --data-urlencode "kind=${KIND}" \
            --data-urlencode "code=${TICKER}" \
            --data-urlencode "user=${USER_ID}" \
            --data-urlencode "text=${TEXT}" > "$RUNNER_TEMP/thread.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload 由来の値はすべて env 経由で渡す (run への ${{ }} 生展開を排除)。
          CHANNEL: ${{ github.event.client_payload.channel }}
          THREAD_TS: ${{ github.event.client_payload.thread_ts }}
          KIND: ${{ github.event.client_payload.kind }}
          TICKER: ${{ github.event.client_payload.ticker }}
          # 返信した本人の Slack user_id。Worker がこの人の建玉 (positions) だけを引く。
          USER_ID: ${{ github.event.client_payload.user }}
          TEXT: ${{ github.event.client_payload.text }}

      # 返信ルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる入力 (スレッド
      # 履歴 / 数値コンテキスト) だけを @ でファイルから取り込む (Slack ユーザーの自由入力を含む外部由来
      # JSON を ${{ }} で prompt に生展開せず YAML 破壊・prompt インジェクションを防ぐ)。ticker は
      # Validate 済みなので prose に展開してよい。skill は @ で読み込んで structured_output で返すだけ。
      - name: Run slack-reply
        id: reply
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker (GitHub App "omnistove-internal-auth") 発の repository_dispatch の actor は
          # その App の Bot になるため許可する。OAuth 経由の claude / 手動の github-actions[bot] も併記。
          allowed_bots: "omnistove-internal-auth,claude,github-actions[bot]"
          prompt: |
            # slack-reply — 対象銘柄 ${{ github.event.client_payload.ticker }}

            A user replied in-thread to your earlier analysis for this ticker. Match the user's language (usually 日本語).

            ## Inputs

            Two JSON inputs are embedded inline below. Do not post to Slack; do not run any script; do not write
            any file — return your reply as structured output and stop. Answer only on what these inputs show
            now; never on hindsight or a later result.

            The **thread JSON** is `{ channel, thread_ts, kind, replies: [...], positions }`. `replies` is
            `[{ user, text, ts }, ...]`; `kind` (`ticker-brief` / `crash-scenario`, older threads may carry
            `signal-judge` — treat as `ticker-brief`) is what the user is replying to; the last `replies` entry is the
            question to answer, the earlier ones the original analysis and any back-and-forth. Empty `replies` →
            ask what they want to know, in one line, and stop.

            `positions` is the user's own holdings for this ticker: `{ status, ref_price, positions: [{ account,
            side, avg_price, qty, pnl_pct }, ...] }`. `status: none` → no holdings. `pnl_pct` is from
            `ref_price`; null when no price was available.

            `profile` is the user's own trading preferences, set via `/profile`: `{ status, risk_tolerance,
            hold_style, max_position_pct, note }`. `status: none` → not set. `risk_tolerance` is `low`/`mid`/`high`,
            `hold_style` is `swing`/`day`/`mid_long` (玉の持ち方の基本), `max_position_pct` a per-name size cap (%),
            `note` free-text 特記事項. Any field may be null.

            The other JSON is the **numeric context** — `tape`/`premarket`/`margin` are current values,
            `context_body` is the fixed accumulated context:

            - **`context_body`** is your primary fundamental input, lead on it; 直近の重大トピック is freshest.
              Null → say `context: unavailable` and answer on price + backdrop alone.
            - **`ticker_note`**: qualifies the other inputs, never leads.
            - **`prices` / `premarket` / `margin`** confirm the fundamental read with the current tape; don't let
              them flip it. `premarket.us_session: carried_over` = the US was closed and those numbers are a
              carried-over prior close, not a fresh overnight move. Pair **`market_phase`** with
              `prices.quote_status`: a `closed`/stale tape is about to
              open (premarket) vs already closed — demote a stale tape, don't read a fresh move into it.
              In-session, `daily` is the prior confirmed bar (so `vol_x_20d` is yesterday's); for today's 出来高
              read `daily.vol_x_20d_intraday`.
            - the ticker's `name`/`sector`/`fair_per` are in `worker/src/lib/watchlist.ts`.

            ## What to do

            - Answer the user's actual question; don't re-run the whole analysis unless asked. If they push
              back on a reading, weigh their point against the data honestly — concede where they're right,
              hold where the data holds, and say which.
            - **You provide research and facts, not trading calls.** Do not tell the user to buy, sell, 利確,
              損切り, or size a position — even when asked "should I". Lay out the materials, numbers, and
              risks that bear on their question and leave the decision to them; say so plainly when they ask
              for a verdict.
            - When holdings are present, relate the facts to the user's own entry, size, and unrealized
              P&L. Don't assume holdings beyond what's registered.
            - When `profile` is set, frame the answer to the user's risk tolerance, hold style, size cap, and
              特記事項. Don't override the data — surface where their preference and the data diverge.
            - Stay consistent with the original `kind`: a ticker-brief thread is about the materials and
              their impact; a crash-scenario thread is about the crash paths, triggers, and defenses. Don't
              silently switch frames.
            - Keep it to a few sentences unless they asked for depth; no preamble.

            ## Web research (supplementary)

            The collected data is primary. You may use WebSearch/WebFetch when the user's question needs a
            fact the inputs don't carry — at most 4 search+fetch calls total; cite the source (媒体名, 日付);
            if you find nothing solid, say so — never invent a source.

            ## Output

            Return your reply as structured output and stop; the schema fixes the shape.

            ## スレッド文脈

            @${{ runner.temp }}/thread.json

            ## 数値コンテキスト

            @${{ runner.temp }}/numctx.json
          # LLM に curl/sh を叩かせない: 投稿は次ステップが行うので Bash/Write は渡さず
          # Read + WebSearch/WebFetch (追加取材) のみ許可。
          # --json-schema で出力の形を縛る。reply = 同スレッドへ貼る返信本文 (日本語)。
          claude_args: >-
            --model opus --effort high --allowedTools Read,WebSearch,WebFetch --max-turns 50
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["reply"],
              "properties":{
                "reply":{"type":"string","description":"同スレッドへ貼る返信本文。見出し・JSON なしの本文のみ"}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # skill の構造化出力 (structured_output {reply}) を同スレッドへ投稿する (channel/thread_ts は thread.json から)。
      - name: Post reply to thread
        run: |
          printf '%s' "$REPLY_JSON" > "$RUNNER_TEMP/reply.json"
          bash scripts/post-reply.sh reply "$RUNNER_TEMP/thread.json" "$RUNNER_TEMP/reply.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPLY_JSON: ${{ steps.reply.outputs.structured_output }}
