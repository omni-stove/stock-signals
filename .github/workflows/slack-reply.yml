# Slack スレッド返信 → 銘柄コンテキスト+価格/市場状況+スレッド履歴 → Claude Code Action で
# 返答生成 → 同じ Slack スレッドへ投稿。
#
# ticker-brief / crash-scenario が Bot トークン (Worker /slack/post) で投稿した解析結果に、
# ユーザーがスレッド返信すると、Worker の /slack/events が thread_ts→銘柄を D1 で復元して
# repository_dispatch (event_type=slack-reply) で起動する。client_payload に
# ticker / kind(元の解析種別) / channel / thread_ts / text(ユーザーの返信本文) が入る。
# このワークフローは Issue を一切書き換えない (出力は Slack スレッドのみ)。
#
# 起動は Slack 専用 (GitHub 画面からの手動実行は持たない = watchlist.ts の写経先を増やさない)。
#
# 認証は Claude サブスク (OAuth): ticker-brief.yml と同じ CLAUDE_CODE_OAUTH_TOKEN。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SLACK_BOT_TOKEN          … xoxb- トークン。スレッド履歴取得 (conversations.replies) に必須
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# Worker 側の追加設定: SLACK_BOT_TOKEN / SLACK_REPLY_CHANNEL / SLACK_SIGNING_SECRET。
#   GitHub App 認証 (GH_APP_*) は ticker-brief の dispatch と共用。

name: slack-reply
run-name: slack-reply ${{ github.event.client_payload.ticker }}

on:
  # Slack スレッド返信 → Worker /slack/events が repository_dispatch で起動する。
  repository_dispatch:
    types: [slack-reply]

# スレッドごとに同時実行を1本に抑え、走行中に同じスレッドへ続けて返信が来たら古いジョブを
# キャンセルする (最新の返信に答えればよい)。Slack に出すだけで状態を持たないので整合は崩れない。
concurrency:
  group: slack-reply-${{ github.event.client_payload.thread_ts }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  slack-reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示が判断の邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 数値コンテキスト (earnings/prices/daily/premarket/margin/銘柄コンテキスト/event_context) を
      # Worker /judge-context が 1 call で正規化して返す。ticker-brief と同じエンドポイント。
      - name: Build numeric context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/judge-context?code=${TICKER}" > "$RUNNER_TEMP/numctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload 由来の値は ${{ }} で run/jq/prompt に生展開せず env 経由で渡す
          # (Slack ユーザーの自由入力が Worker 経由で透過してくるためインジェクション対策)。
          TICKER: ${{ github.event.client_payload.ticker }}

      # スレッド文脈 (会話履歴 + 返信先) を Worker /thread-context が 1 call で返す。
      # conversations.replies の取得・整形・ok:false フォールバック・payload text の末尾追加は
      # すべて Worker 側 (決定論的) で行い、skill には curl を叩かせず Read させるだけにする
      # (judge-context / market-context / context-input と同じ方針)。出力は
      # { channel, thread_ts, kind, replies: [{user,text,ts}, ...] }。
      # payload 由来の値 (Slack ユーザーの自由入力が透過してくる) は --data-urlencode で
      # クエリにエンコードして渡す (run/prompt への ${{ }} 生展開を排除)。
      - name: Build thread context
        run: |
          curl -fsS -G "${WORKER_URL%/}/thread-context" \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            --data-urlencode "channel=${CHANNEL}" \
            --data-urlencode "thread_ts=${THREAD_TS}" \
            --data-urlencode "kind=${KIND}" \
            --data-urlencode "code=${TICKER}" \
            --data-urlencode "user=${USER_ID}" \
            --data-urlencode "text=${TEXT}" > "$RUNNER_TEMP/thread.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload 由来の値はすべて env 経由で渡す (run への ${{ }} 生展開を排除)。
          CHANNEL: ${{ github.event.client_payload.channel }}
          THREAD_TS: ${{ github.event.client_payload.thread_ts }}
          KIND: ${{ github.event.client_payload.kind }}
          TICKER: ${{ github.event.client_payload.ticker }}
          # 返信した本人の Slack user_id。Worker がこの人の建玉 (positions) だけを引く。
          USER_ID: ${{ github.event.client_payload.user }}
          TEXT: ${{ github.event.client_payload.text }}

      # 返信ルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる入力 (スレッド
      # 履歴 / 数値コンテキスト) だけを @ でファイルから取り込む (Slack ユーザーの自由入力を含む外部由来
      # JSON を ${{ }} で prompt に生展開せず YAML 破壊・prompt インジェクションを防ぐ)。ticker は
      # Validate 済みなので prose に展開してよい。skill は @ で読み込んで structured_output で返すだけ。
      - name: Run slack-reply
        id: reply
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Worker (GitHub App "omnistove-internal-auth") 発の repository_dispatch の actor は
          # その App の Bot になるため許可する。OAuth 経由の claude / 手動の github-actions[bot] も併記。
          allowed_bots: "omnistove-internal-auth,claude,github-actions[bot]"
          prompt: |
            # slack-reply — ticker ${{ github.event.client_payload.ticker }}

            A user replied in-thread to an earlier analysis of this ticker. Answer their question with research
            and facts. **Never output a trading call or a position action**: do not tell the user to buy, sell,
            利確, 損切り, hedge, or size a position — even when asked "should I"; say plainly that the decision is
            theirs. Quote a figure only as the inputs or a cited source state it; never compute or estimate one.

            Answer only on what these inputs show now; never on hindsight or a later result.

            Do not post to Slack; do not run any script; do not write any file — return your reply as
            structured output and stop.

            ## Inputs

            **Thread JSON** `{ channel, thread_ts, kind, replies, positions, profile }`:

            - **`replies`** (`[{ user, text, ts }, ...]`): the last entry is the question to answer; the earlier
              ones are the original analysis and any back-and-forth. Empty → ask in one line what they want to
              know, and stop.
            - **`kind`**: what the user is replying to — `crash-scenario` = a crash pre-mortem; any other value =
              a 材料ブリーフ.
            - **`positions`** (`{ status, ref_price, positions: [{ account, side, avg_price, qty, pnl_pct }] }`):
              the user's own holdings in this ticker. `status: none` → no holdings. `pnl_pct` is against
              `ref_price`; null = no price.
            - **`profile`** (`{ status, risk_tolerance, hold_style, max_position_pct, note }`): the user's own
              preferences. `status: none` → not set; any field may be null. `risk_tolerance` `low`/`mid`/`high`,
              `hold_style` `swing`/`day`/`mid_long`, `max_position_pct` the user's own per-name size cap (%), `note`
              free-text 特記事項. Never turn `max_position_pct` into a size, a quantity, or an add/trim.

            **Numeric context** — a block with nothing to report is left out; an absent block means no data:

            - **`context_body`** leads on fundamentals; 直近の重大トピック is freshest. Absent → say
              `context: unavailable` and answer on price and backdrop alone.
            - **`ticker_note`**: qualifies the other inputs; never leads.
            - **`market_phase`** with **`prices.quote_status`**: `closed` → the tape is not live; do not read a
              fresh move into it. In-session, `daily` is the prior confirmed bar — today's 出来高 is
              `daily.vol_x_20d_intraday`.
            - **`prices` / `daily` / `margin` / `premarket`** confirm or contradict the fundamental read; never
              let them flip it alone. `premarket.status: stale` → backdrop only; `us_session: carried_over` → a
              prior close the last JP session already traded on, not a fresh overnight move.
            - **`market_brief`** (`{ headline, body, date }`): market-wide backdrop, including 投資部門別 and
              空売り比率; never a material of this name. `date` before today → an earlier morning's backdrop.
            - **`event_context`** (`需給イベント(<date>): <…>`): an event-driven tape factor (SQ, rebalance, macro,
              peer earnings); weigh it before crediting a move to a material. `特になし` → ignore.
            - **`earnings`** (next date) and **`earnings_result`** (`status: fresh` → `verdict` beat/miss/inline;
              other statuses → skip).
            - **`forced`**: `summary` states the forced-flow timing; take it as given.
            - **Medium-term and supply-demand blocks** answer questions on positioning and flows: `trend` (MA75,
              52週高値・安値), `relative` (excess return vs TOPIX over 5/20/60 days), `event_reactions` (how each
              recent disclosure traded vs TOPIX), `revisions` (company forecast and its 修正; no analyst consensus
              is collected), `valuation` (予想PER/PBR, own range, sector peers; never 割安/割高 on the number
              alone), `short_interest` (逆日歩; institutional short reports — an old `calc_date` is weak evidence),
              `sector` (`rank` of `peers_n`, `rel_strength_pct`), `supply` (売出し/公募/CB/大株主の異動; `lockup_*` are
              rough dates from the announcement; `large_holding_*` = EDINET 大量保有・変更報告書 with `ratio_pct` /
              `prev_ratio_pct`).
            - The ticker's `name`/`sector` are in `worker/src/lib/watchlist.ts`.

            ## Answering

            - Answer the actual question; re-run the whole analysis only when asked. When they push back on a
              reading, weigh their point against the data — concede where they are right, hold where the data
              holds, and say which.
            - With holdings, relate the facts to the user's own entry and unrealized P&L; assume no holdings
              beyond what is registered.
            - With a `profile`, frame the answer to their risk tolerance, hold style, and 特記事項; where their
              preference and the data diverge, say so rather than bend the data.
            - Stay in the thread's frame: a 材料ブリーフ thread is about the materials and their impact; a
              crash-scenario thread is about the crash paths, triggers, and leading signs.

            ## Web research (supplementary)

            The collected inputs are primary. You may use WebSearch/WebFetch only to corroborate or deepen
            something already in the inputs or the thread: at most 4 search+fetch calls total; cite the source
            (媒体名, 日付); if nothing solid turns up, say so — never invent a source.

            ## Output

            `reply`: the reply body only, in the user's language (usually 日本語) — no heading, no JSON, no
            preamble; a few sentences unless they asked for depth.

            ## スレッド文脈

            @${{ runner.temp }}/thread.json

            ## 数値コンテキスト

            @${{ runner.temp }}/numctx.json
          # LLM に curl/sh を叩かせない: 投稿は次ステップが行うので Bash/Write は渡さず
          # Read + WebSearch/WebFetch (追加取材) のみ許可。
          # --json-schema で出力の形を縛る。reply = 同スレッドへ貼る返信本文 (日本語)。
          claude_args: >-
            --model opus --effort high --allowedTools Read,WebSearch,WebFetch --max-turns 50
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["reply"],
              "properties":{
                "reply":{"type":"string"}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # skill の構造化出力 (structured_output {reply}) を同スレッドへ投稿する (channel/thread_ts は thread.json から)。
      - name: Post reply to thread
        run: |
          printf '%s' "$REPLY_JSON" > "$RUNNER_TEMP/reply.json"
          bash scripts/post-reply.sh reply "$RUNNER_TEMP/thread.json" "$RUNNER_TEMP/reply.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPLY_JSON: ${{ steps.reply.outputs.structured_output }}
