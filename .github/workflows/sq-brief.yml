# SQ週ブリーフ → Claude Code Action で SQ週の値動きシナリオ → Slack通知。
#
# 日本SQ週 (SQ日を含む月〜金) の毎朝、市場全体の SQ週の値動きシナリオと、監視銘柄が SQ にどれだけ
# 振られやすいか (SQ連動度) を 1 本にまとめて届ける。売買の方向・指値・損切りは出さない — 判断は読み手が行う。
#
# 起動経路は 2 つ:
#   - repository_dispatch (event_type=sq-brief) … Worker の寄り前 intake cron (JST 08:30) が
#       market-brief の直後、今日が日本SQ週のときだけ発火する (worker/src/lib/cron.ts)。
#   - workflow_dispatch … 手動実行 (検証用)。引数なし。SQ週以外は次の SQ を対象にする。
#
# 起動後はルールを prompt にベタ書きした Claude Code Action が Worker /sq-context の JSON を @ で読み、
# シナリオを structured_output で返す。投稿は後続ステップ (post-sq.sh) が数値行を決定論で足して行う。
# **このワークフローはコンテキストを一切書き換えない** (出力は Slack のみ)。
#
# 認証・Secret は market-brief.yml と同じ:
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)

name: sq-brief

on:
  repository_dispatch:
    types: [sq-brief]    # Worker の寄り前 intake (JST 08:30) が SQ週の朝だけ発火する。
  workflow_dispatch: {}  # 手動実行 (検証用)。引数なし。

concurrency:
  group: sq-brief
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  sq-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示がブリーフの邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # SQ の日付・過去の SQ週の値動きと SQ連動度・今週の途中経過・前夜の地合いを Worker /sq-context が
      # 1 call で返す。集計は Worker 側 (決定論) で行い、skill は Read するだけ。
      - name: Build SQ context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/sq-context" > "$RUNNER_TEMP/sqctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Run sq-brief
        id: brief
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "omnistove-internal-auth,github-actions[bot]"
          prompt: |
            # sq-brief

            Produce the morning **SQ週ブリーフ** for a semis-heavy Japanese watchlist held for days to three
            weeks: the paths this SQ week can take, and how strongly SQ pushes each name compared with its
            normal days. Give scenarios with 確度, never a verdict: no buy/sell direction, no 指値, no 損切り, no
            advice verbs. Do not forecast any single name. Never write a figure (price, %, multiple, count); the
            posting step appends the SQ date, this week's returns, NT倍率, and each name's SQ連動度.

            Judge only on what these inputs show now; never on hindsight or a later result.

            Do not post to Slack; do not run any script; do not write any file — return structured output
            and stop.

            ## Inputs

            Lead on `history` and `week_to_date` (what SQ has done to these names and how this week has run into
            it); `premarket` sets today's gap; the rest only raises or lowers 確度.

            - **`market_phase`**: `premarket` (today's gap isn't in yet) / 場中 / `closed`.
            - **`sq`**: this week's 日本SQ — `date`, `major` (true = メジャーSQ, futures and options settle; false =
              options only, a weaker pull), `days_to_sq` (0 = today is SQ day, pre-open). `in_week: false` → not an
              SQ week (manual run); frame the brief as a preview of the next SQ.
            - **`market.nikkei225`** leads the market-wide scenarios; its `history` carries `*_excess` vs TOPIX —
              how far SQ pushed 日経225 apart from the broad market. **`market.topix`** is the broad-market
              reference. **`market.nt_ratio`** (`nt`, `prev_week_end`, `avg_20d`): rising into SQ = the 日経225 side
              bid harder than the broad market, falling = sold harder; `insufficient` → skip.
            - **`market.*.history`** and **`tickers[].history`** — past SQ weeks from stored daily bars. Per event:
              `pre_ret_pct` (前週末→SQ前日), `week_ret_pct` (前週末→SQ日終値), `sq_gap_pct` (SQ前日終値→SQ日始値),
              `sq_vol_x` (SQ日出来高 ÷ 20日平均), `post_ret_pct` (SQ日→翌週末), `sq_day_share` (SQ day's share of the
              week's daily ranges through SQ), `pre_day_abs_pct` (mean daily range before SQ day). `all` / `major`
              aggregate them (`n`, `mean`, `median`, `up_ratio`); tickers also carry `week_excess` /
              `sq_gap_excess` / `post_excess` vs TOPIX. `status: insufficient` → skip that name.
            - **`sensitivity`** (SQ連動度, each against non-SQ weeks; 1 = as usual): `sq_gap_abs_x` (SQ-day opening
              gap vs the same weekday's gap in normal weeks), `sq_day_share` vs `normal_day_share`,
              `pre_day_abs_x` (daily range before SQ day vs normal days), `sq_week_abs_x` (SQ-week range vs normal
              weeks), `sq_vol_x` (SQ-day volume multiple), `reversal_rate` (share of SQ weeks whose move reversed
              after SQ). For each name, read where SQ's push lands — the SQ-day open, the days before SQ, or the
              unwind after it — and how far above normal it runs.
            - **Sample size**: the fewer events behind an aggregate (`n`), the less weight it carries; never
              present an average of a handful of events as a law, and say so when `n` is thin.
            - **`events[].tags`** — what else was going on in each past SQ week: `trend` (the tape before the SQ
              week: up / down / range), `earnings` (`sq_week` / `post_week` / `none`; `unknown` = no record that
              far back; `null` = index), `macro` (FOMC・日銀・ピア決算・指数採用/除外 in the SQ week), `confounded`
              (earnings or macro overlapped). `clean` / `sensitivity_clean` are the same aggregates over the
              non-confounded events, present only when some event was confounded. When `sensitivity` and
              `sensitivity_clean` disagree, lead with `sensitivity_clean` and name the tagged event behind the
              gap; when `clean.n` is too thin to separate the SQ effect, say so. Use `trend` to explain an
              outlier or to name which past weeks resemble this one, never to filter the aggregates further.
            - **`week_to_date`**: this week so far (return since 前週末, `excess_pct` vs TOPIX). A week that has
              already run hard into SQ is what `reversal_rate` speaks to.
            - **`premarket`** (last night's NY): `sox_change_pct` leads for semis, `nikkei_futures_price` is the
              home gap; ドル円・米10年債・VIX only confirm. `status: stale` → demote; `us_session: carried_over` → not
              fresh.
            - **`live_indexes`** (場中の日経225/KOSPI): pre-open they are stale → skip.
            - **`market_short_ratio`** (空売り比率 vs its 5日平均): heavy hedging is squeeze fuel into SQ.
              **`investor_flows`** (weekly 海外投資家 net and its streak). `unavailable` → skip either.
            - **`event_context`**: other events this week — FOMC/日銀/ピア決算 overlapping the SQ week reshape the
              scenarios; `特になし` → ignore.

            ## Output

            Japanese, one point per line, clipped note style, no figures.

            - `headline`: `🎯 SQ週ブリーフ: <one phrase>` — what matters most for this SQ week today.
            - `scenarios`: 2–3 distinct paths through SQ day and into SQ明け. Each has `name` (a few words),
              `likelihood` grounded in the inputs (history, this week's run, tonight's backdrop), `trigger` (an
              event or move in the inputs that would set it off), and `path`. On SQ day (`days_to_sq` 0) center
              them on the opening print and the post-SQ unwind; earlier in the week, weigh the names whose SQ
              push lands on the days before SQ.
            - `sensitivity`: rank the names by how hard SQ pushes them and say where the push lands (SQ日の寄り /
              SQ前の日々 / 明けの反転), one point per line.
            - `watch`: 1–3 facts to check today (a print or an event), as facts to watch, not instructions.

            ## SQコンテキスト

            @${{ runner.temp }}/sqctx.json
          claude_args: >-
            --model opus --effort high --allowedTools Read --max-turns 30
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["headline","scenarios","sensitivity","watch"],
              "properties":{
                "headline":{"type":"string"},
                "scenarios":{"type":"array","minItems":2,"maxItems":3,"items":{
                  "type":"object","additionalProperties":false,
                  "required":["name","likelihood","trigger","path"],
                  "properties":{
                    "name":{"type":"string"},
                    "likelihood":{"type":"string","enum":["高","中","低"]},
                    "trigger":{"type":"string"},
                    "path":{"type":"string"}
                  }}},
                "sensitivity":{"type":"array","items":{"type":"string"},"maxItems":5},
                "watch":{"type":"array","items":{"type":"string"},"maxItems":3}
              }
            }'

      # 構造化出力を Slack に投稿する。第2引数 = LLM に渡したのと同じ sqctx。post-sq.sh が 📐 数値
      # (SQ日・今週リターン・SQ連動度) を sqctx の実在値から組んで親に貼る。
      - name: Post sq-brief to Slack
        run: |
          printf '%s' "$SQ_JSON" > "$RUNNER_TEMP/sq.json"
          bash scripts/post-sq.sh "$RUNNER_TEMP/sq.json" "$RUNNER_TEMP/sqctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SQ_JSON: ${{ steps.brief.outputs.structured_output }}
