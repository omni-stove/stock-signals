# 銘柄コンテキスト + 価格/市場状況 → Claude Code Action で材料ブリーフ → Slack通知。
#
# 2段アーキテクチャの後段。前段 context-builder が銘柄の持続コンテキストを更新したあと、
# repository_dispatch (event_type=ticker-brief、client_payload.ticker に単一銘柄) でこのワークフローを
# 起動する。手動でも実行できる。
#
# 起動後はブリーフのルールを prompt にベタ書きした Claude Code Action が対象銘柄の数値コンテキスト
# (context-builder が育てたコンテキスト本文 + Worker /judge-context の価格/日足/市場ブリーフ/決算日/信用残)
# を @ で読み、新着材料の見出し・テクニカルの読み・強気/弱気材料 (新着材料の背景・影響分析を含む) を structured_output で返す。
# 売買判断 (buy/sell・指値・損切り) は出さない — 判断は読み手 (人間) が行い、ここは判断材料を
# 並べる係。投稿は後続ステップ (post-brief.sh)。**このワークフローはコンテキストを一切書き換えない**
# (出力は Slack のみ)。context-builder がコンテキストを書き、ticker-brief が Slack を書く、という
# 役割の固定により、brief → context の編集ループは発生しない。
#
# 認証は Claude サブスク (OAuth) 方式: ローカルで `claude setup-token` → 生成トークンを
# リポジトリ Secret CLAUDE_CODE_OAUTH_TOKEN に設定する。
#
# 必要な設定 (Settings → Secrets and variables → Actions):
#   secret   CLAUDE_CODE_OAUTH_TOKEN  … `claude setup-token` の出力 (必須)
#   variable WORKER_URL               … https://stock-signals-collector.<sub>.workers.dev (必須)
#   secret   SYNC_TOKEN               … Worker に SYNC_TOKEN を設定している場合のみ (任意)
# ブリーフ通知は script が Worker /slack/post に投げる (Bot 投稿)。Worker 側の追加設定:
# SLACK_BOT_TOKEN / SLACK_REPLY_CHANNEL。未設定 (503) なら投稿スキップ。
# 発火元 (context-builder) は github.token (GITHUB_TOKEN) で repos/.../dispatches を叩く。

name: ticker-brief
run-name: ticker-brief ${{ github.event.client_payload.ticker || inputs.ticker }}

on:
  # context-builder がコンテキストを更新した (新着材料があった) あとに銘柄ごとに叩く。
  repository_dispatch:
    types: [ticker-brief]
  workflow_dispatch:       # 手動実行 (検証用)。対象銘柄を選んで実行する。
    inputs:
      ticker:
        description: 対象銘柄コード
        required: true
        type: choice
        # worker/src/lib/watchlist.ts の TICKERS と同期させる。
        # 下の options は `npm run gen:watchlist` が自動生成する (手で編集しないこと)。
        options:
          # GEN:watchlist:start
          - "285A"  # キオクシアホールディングス
          - "6857"  # アドバンテスト
          - "6920"  # レーザーテック
          - "6976"  # 太陽誘電
          - "6981"  # 村田製作所
          # GEN:watchlist:end

# 銘柄ごとに同時実行を1本に抑え、走行中に同じ銘柄の新しいブリーフ要求が来たら古いジョブをキャンセルする。
# ticker-brief は Slack に出すだけで状態を持たない (Issueを書かない) ので、キャンセルしても整合は崩れない。
concurrency:
  group: ticker-brief-${{ github.event.client_payload.ticker || inputs.ticker }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # claude-code-action@v1 が OIDC トークン取得に要求する

jobs:
  ticker-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Action 実行時は CLAUDE.md / AGENTS.md の指示がブリーフの邪魔になりうるので退避する (共通アクション)。
      - uses: ./.github/actions/stash-claude-md

      # payload/inputs.ticker を watchlist の許可リストと照合し、未知の銘柄なら即 fail する。
      # ticker は後段で skill prompt に文字列展開されるため、ここで弾くことで
      # 細工した銘柄文字列による prompt インジェクションを防ぐ (env 経由 + 許可リスト)。
      - name: Validate ticker
        env:
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
        run: |
          if ! grep -qE "^[[:space:]]*code:[[:space:]]*\"${TICKER}\",[[:space:]]*$" worker/src/lib/watchlist.ts; then
            echo "::error::unknown ticker: $TICKER"; exit 1
          fi

      # 数値コンテキスト (earnings/prices/daily/premarket/margin/銘柄コンテキスト) と需給イベント文脈
      # (SQ/指数リバランス/FOMC/日銀/ピア決算) を Worker /judge-context が 1 call で正規化して返す。
      # 鮮度判定・20日レンジ位置・MA位置・出来高倍率・days_to_earnings・market_phase・event_context は
      # すべて Worker 側 (決定論的) で算出済み。skill には curl を叩かせず材料の読解と分析だけをさせる。
      # JSON は複数行・特殊文字を含むので prompt に直接埋めず、ファイルに書いて skill にパスを渡す。
      #
      # 指数リバランス窓 (/index-rebalance) は LLM には渡さない観測事実なので、numctx.json とは
      # **別ファイル** (rebalance.json) に保存する。同じファイルに混ぜると skill に余計なリバランス
      # 情報が渡ってしまうため、保存場所を情報ごとに分ける。両 curl は依存が無いので & で並行に
      # 走らせ、wait で揃える (judge-context のレイテンシに相乗りで実質ゼロコスト)。
      # リバランスは窓外なら note が空になり、post-brief.sh 側で何も貼らない。fetch 失敗は空ファイル。
      - name: Build numeric context
        run: |
          curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${WORKER_URL%/}/judge-context?code=${TICKER}" > "$RUNNER_TEMP/numctx.json" &
          numctx_pid=$!
          # リバランスはブリーフに必須でない観測事実。fetch 失敗でもブリーフを止めず空ファイルで続ける。
          ( curl -fsS -H "Authorization: Bearer ${SYNC_TOKEN}" \
              "${WORKER_URL%/}/index-rebalance" > "$RUNNER_TEMP/rebalance.json" || : > "$RUNNER_TEMP/rebalance.json" ) &
          rebal_pid=$!
          # judge-context は必須。失敗したらここで落とす。リバランスは結果を問わず待つだけ。
          wait "$numctx_pid"
          wait "$rebal_pid" || true
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          # payload/inputs 由来の ticker は run へ生展開せず env 経由で渡す。
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}

      - name: Run ticker-brief
        id: brief
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # context-builder 発の repository_dispatch を許可する。context-builder は OAuth
          # (claude_code_oauth_token) で走るため、その中から叩く dispatch の actor は
          # github-actions[bot] ではなく claude (type: Bot) になる。手動/github.token 経由の
          # github-actions[bot] も許すため両方を列挙する。既定では Bot起動を Action が弾く。
          # Slack スラッシュコマンド /brief 経由は Worker (GitHub App "omnistove-internal-auth")
          # 発の dispatch なので、その App の Bot も許可する (slack-reply.yml と同じ)。
          allowed_bots: "omnistove-internal-auth,claude,github-actions[bot]"
          # ブリーフのルールは prompt にベタ書きする (skill ファイルは持たない)。実行時に変わる数値コンテキスト
          # だけを @ でファイルから取り込む (外部由来 JSON を ${{ }} で prompt に生展開せず YAML 破壊・
          # prompt インジェクションを防ぐ)。ticker は Validate 済みなので prose に展開してよい。
          prompt: |
            # ticker-brief — 対象銘柄 ${{ github.event.client_payload.ticker || inputs.ticker }}

            Produce a **材料ブリーフ** — a research digest for a human to make their own trading decision.
            Headline the fresh materials on this name and lay out the 強気/弱気 case. **Never output a trading
            call**: no buy/sell, no 押し目/指値/損切り levels, no advice verbs (買い/売り/利確/増し玉/様子見).
            Price levels and indicator values belong to the posting step, which appends
            the real ones (現値/MA/レンジ/ATR, MA25乖離/RSI/出来高倍率/OBV/CMF, MA75/52週高値・安値/TOPIX比/予想PER)
            deterministically — do not restate numeric levels or indicator values in your text. You may —
            and should — describe what the tape did (急伸/出来高急増/セクタ内で劣後 など) as fact.

            The reader holds swing positions of several days to about three weeks. Weigh each material by how
            it plays out over that horizon: lead on what moves earnings or supply-demand within it, and demote
            what only matters for a session or only beyond it.

            Report what you can see now — context, numbers, `event_context` — never hindsight framing
            ("priced in", "unexplained" volume, a top being "in"). Ground every claim in a material,
            a number, or a sourced find; write nothing you cannot attribute.

            ## Output shape

            Write in Japanese for a reader who sees only this post. Put each fact in one place only. Give each
            line one point in about 40 characters, in clipped note style: the fact, then its effect. Do not
            use polite endings, narrating connectives, or hedges unless the uncertainty is the point. Do not
            name an input or describe your research; state an unresolved point as unconfirmed.

            - `status`: default `brief`. Return `no_update` only when the freshest entry in 直近の重大トピック
              is older than 14 days and there is no fresh earnings or guidance, forced-flow reading, or notable
              tape move. When in doubt, brief. On `no_update`, leave `headline` null and every array empty.
            - `headline`: exact format, verbatim: `📰 <ticker> <name>: <one-phrase summary of the fresh materials>`.
            - `materials`: the fresh items, newest first; merge items on one theme. Each is
              `YYYY-MM-DD <what happened>` only — no effect or analysis.
            - `technical`: whether trend and money flow confirm or diverge from the fresh materials. Do not
              restate indicators one by one, forecast, or name a level to act on. Empty when `daily` is absent.
            - `bull` / `bear`: the strongest points on earnings and supply-demand, fresh materials first, as
              facts and their weight. For a fresh material, give why it matters: the concrete path into
              earnings or price, and a precedent or first market reaction when known. Either side may be empty
              when the materials lean one way.
            - `watch`: the next verifiable fact that would change the picture, leading with its date when known.

            ## Web research (supplementary)

            The collected data (`numctx.json` + `context_body`) is primary. You may use WebSearch/WebFetch
            to enrich `bull` / `bear` — 一次情報 (会社 IR/取引所/当局), 海外報道, アナリスト見解 — under these
            rules: at most 4 search+fetch calls total; only to corroborate or deepen a material you already
            see in the inputs, not to hunt for unrelated stories; cite the source inline in `bull` / `bear`
            (媒体名, 日付); if you find nothing solid, write nothing — never invent a source or a fact.

            ## Inputs

            How to read the fields (what to lead on, what to ignore). A block with nothing to report is left
            out; an absent block means no data — do not mention it.

            - **`context_body`** carries two layers: 直近の重大トピック (freshest) and older structural context.
              Absent → brief on price/tape facts alone.
            - **`market_brief`** (`{ headline, body, date }`): the morning market-wide fact summary (前夜米市場・
              先物・セクター・投資部門別・空売り比率・当日イベント). Use it to frame today's backdrop.
            - **`prices`**: `latest` is the last quote (`change_pct` 前日比). `quote_status: closed` → stale tape,
              demoted to backdrop. `live` adds `trajectory`: today's 前日比 at `from_quote_time` and its
              high/low since then — the intraday path.
            - **`market_phase`** (JST trading-day position) says what to lead on: `premarket` → lead on
              `premarket`/context (digesting overnight NY); `afternoon_session` with a live tape → lead on the
              live tape; `closed` → describe the close.
              - **During the session** (`morning_session`/`lunch_break`/`afternoon_session`) `daily` has no
                confirmed bar for today yet, so `daily.latest_date` is the **prior** trading day and `vol_x_20d` /
                `range_pct` / MA乖離 are all on that prior bar — do not read them as today's. For 出来高 use
                `daily.vol_x_20d_intraday` (today's cumulative volume pace-projected to a full day ÷ 20日平均);
                null near the open means too little has traded to project. After `closed`, `vol_x_20d` is the
                confirmed value again and `vol_x_20d_intraday` is null.
            - **`daily`** (technicals on the latest confirmed bar): `ma_position` / `ma25_dev_pct` = trend and
              stretch; `rsi_14` = momentum heat; `range_pct` = where price sits in the 20日レンジ;
              `atr_vs_baseline` = volatility vs its own norm; `obv_trend` / `ad_trend` / `cmf_20d` = money flow —
              a flow reading that diverges from price leads over price alone. `volume_quality` and
              `momentum_state` are precomputed reads — take them as given (`na` = not applicable, skip).
              Weigh technicals as confirmation of or divergence from the materials, not as a standalone call.
            - **`premarket`** (prior NY session): `sox_change_pct` is the overnight external backdrop —
              `sector` leads over it; `nasdaq_change_pct` / `dow_change_pct` / `nikkei_futures_price` only confirm.
              The macro channels: `usdjpy_price` / `usdjpy_change` (円, 前日比) moves exporters' earnings through the
              為替前提; `us10y_yield` / `us10y_change_bp` (bp, US date `us10y_date`) weighs on high-multiple semis
              when it rises; `vix_price` / `vix_change_pct` is market-wide risk appetite. Report one as a fact only
              when its move bears on this name through a channel the context or `ticker_note` shows it is exposed to.
              `us_session: carried_over` = the US was closed overnight (休場明け) and these numbers are the prior
              close (printed `us_close_jst_date`) that the previous JP session already traded on — treat as no new
              overnight information, don't report it as fresh.
            - **`event_context`**: one-line 需給イベント string `需給イベント(<date>): <…>`.
            - **`sector`**: this ticker within its watchlist sector — `rank` of `peers_n` by 相対強弱, its
              `rel_strength_pct` (5日リターン − セクタ平均 `avg_ret_5d_pct`), `change_pct`, `vol_ratio`. This is the
              sector read — lead on it over SOX.
            - **`forced`**: `summary` already states the forced-flow timing
              (投げ/踏み, ~何営業日後のどのセッション, building=これから / exhausted=出尽くし); take it as
              given and report it as a 需給 fact (投げ pending is usually a `bear` line, 踏み上げ a `bull`
              line, or a `watch` line).
            - **Margin** (信用残): report a buildup contradicting the context as a 需給 fact.
            - **`trend`** (MA75 and 52週高値・安値 from about a year of bars): `ma75_dev_pct` = the medium-term
              stretch; `from_high_52w_pct` / `from_low_52w_pct` = how far price sits from the year's extremes —
              report a 52週高値・安値 within reach or just broken as a 需給 fact. `full_year: false` → the window
              starts at `window_start`, not a full year.
            - **`relative`** (`returns[]` per 5/20/60 days: `ret_pct` − `topix_ret_pct` = `excess_pct`): strength
              against the whole market. Use it with `sector` to separate a name-specific move from the market.
            - **`event_reactions`** (`items[]`, up to 3 newest): for each recent disclosure/IR date, the
              excess return over TOPIX across the 2 sessions from the prior close (`excess_2d_pct`) and since then
              to now (`excess_to_date_pct`). Report how the market took a material — a good-news item that sold off
              or faded is itself a fact. `partial: true` = the second session is not in yet.
            - **`revisions`**: the current company forecast (`forecast`: 売上・経常・最終 in 億円, eps/dividend in 円,
              announced `announced_at`) and `revisions[]` within a year (`kind` `up`/`down`/`mixed` = 修正の向き,
              `unchanged` = 据え置き, `initial` = 期初予想; `*_chg_pct` = 修正幅). History before `history_since`
              is not stored. No analyst consensus is collected — do not claim a gap to consensus unless a cited
              source states it.
            - **`valuation`**: 予想PER/PBR/利回り, the PER range over stored snapshots (`per_range` since its
              date), and same-sector `peers` PER. Report the multiple as context for how much good news a price
              already carries; never call it 割安/割高 on the number alone.
            - **`short_interest`**: `lending` = 日証金の逆日歩 (`fee` 円/株 on 申込日 `date`, `fee_streak_days`
              consecutive days charged; `listed: false` = not on the list, no 逆日歩) — a running 逆日歩 is
              short-squeeze fuel. `positions` = institutional short reports of 0.5% or more (`total_ratio_pct`,
              change `total_ratio_chg_pct` since `chg_since`; weigh each holder by its `calc_date`, an old report is
              weak evidence).
            - **`supply`** (`items[]`): disclosures that add supply — 売出し/公募/第三者割当/
              CB/分売/自己株処分/大株主の異動. `lockup_90d` / `lockup_180d` are rough dates counted from the
              announcement; the actual lock-up term and start are in the filing — state them only when confirmed.
              A lock-up end or a pending offering inside the holding horizon is a `bear`/`watch` fact.
            - **Earnings near** (`earnings`) is binary-event risk — report the date as a `watch`/`bear` fact.
              **Just out** (`earnings_result.status: fresh`): report `verdict` (beat/miss/inline) as a
              material, and read the price reaction through **## 決算の特色・クセ** in `context_body` (the
              name may move on a metric other than EPS).
            - **`ticker_note`**: qualifies the other inputs.
            - the ticker's `name`/`sector` are in `worker/src/lib/watchlist.ts`.

            ## 数値コンテキスト

            @${{ runner.temp }}/numctx.json
          # --json-schema で出力の形を縛る (= ticker-brief の構造化スキーマの唯一の定義場所)。
          # 検証済み JSON は steps.brief.outputs.structured_output で受ける。skill には curl/sh を
          # 叩かせない (投稿/保存は次ステップ): Bash は渡さず Read + WebSearch/WebFetch (追加取材) のみ許可。
          claude_args: >-
            --model opus --effort high --allowedTools Read,WebSearch,WebFetch --max-turns 50
            --json-schema '{
              "type":"object","additionalProperties":false,
              "required":["status","headline","materials","technical","bull","bear","watch"],
              "properties":{
                "status":{"enum":["brief","no_update"]},
                "headline":{"type":["string","null"],"maxLength":70},
                "materials":{"type":"array","maxItems":4,"items":{"type":"string","maxLength":50}},
                "technical":{"type":"array","items":{"type":"string","maxLength":80},"maxItems":2},
                "bull":{"type":"array","items":{"type":"string","maxLength":60},"maxItems":4},
                "bear":{"type":"array","items":{"type":"string","maxLength":60},"maxItems":4},
                "watch":{"type":"array","items":{"type":"string","maxLength":50},"maxItems":2}
              }
            }'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      # skill の構造化出力 (structured_output) を Slack に投稿し、ブリーフを Worker に保存する
      # (curl/jq/blocks 組み立て/フォールバックは script が持つ)。第2引数 = ブリーフ JSON、
      # 第3引数 = 前段で並行取得した指数リバランス窓の JSON (LLM には渡していない観測事実)。
      # 第4引数 = LLM に渡したのと同じ numctx。post-brief.sh が 📐 数値 (現在の値と確定足の指標) を numctx の
      # 実在値から決定論で組んでサマリーの見出しの下に貼る (LLM は水準・指標の数値を出さない)。
      - name: Post brief to Slack
        run: |
          printf '%s' "$BRIEF_JSON" > "$RUNNER_TEMP/brief.json"
          bash scripts/post-brief.sh "$TICKER" "$RUNNER_TEMP/brief.json" "$RUNNER_TEMP/rebalance.json" "$RUNNER_TEMP/numctx.json"
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TICKER: ${{ github.event.client_payload.ticker || inputs.ticker }}
          BRIEF_JSON: ${{ steps.brief.outputs.structured_output }}
