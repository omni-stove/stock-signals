[install]
description = "Install the repo's dependencies"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm -C worker install --frozen-lockfile",
]

[setup]
description = "Install dependencies and skill-kit, then sync (run by make setup)"
depends = ["install"]
run = [
  'if [ -f worker/.dev.vars ]; then echo "⏭  worker/.dev.vars は既に存在"; else cp worker/.dev.vars.example worker/.dev.vars; echo "📝 worker/.dev.vars を作成。実値を埋める"; fi',
  "curl -fsSL https://raw.githubusercontent.com/omni-stove/skill-kit/main/install.sh | sh",
  "skill-kit code sync",
]

[update]
description = "Pull skill-kit and re-sync this repo"
run = "skill-kit code update"

[lint]
description = "lint・型チェック・生成物チェック・knip を実行"
run = "pnpm exec run-p -c -s verify:lint verify:typecheck verify:worker:typecheck verify:check:watchlist verify:check:mermaid verify:knip"

[test]
description = "TS テスト（root と worker）と bats を実行"
run = [
  "pnpm run test",
  "pnpm -C worker run test",
  "pnpm run test:sh",
]

[verify]
description = "lint とテストをまとめて実行"
depends = ["lint", "test"]

[format]
description = "Biome の自動修正を当てる"
run = "pnpm run format"

[gen-watchlist]
description = "worker/src/lib/watchlist.ts の TICKERS から workflow の選択肢を生成する"
run = "pnpm run gen:watchlist"
