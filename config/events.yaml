# マクロ/需給イベントカレンダー (手動メンテ)
#
# 個別銘柄の決算 (watchlist.yaml の next_earnings_date) とは別に、
# 相場全体・需給に効くイベントの日付をここに並べる。
# scripts/events.ts がこれを読み、「直近 N 日以内のイベント」を一覧表示し (人間の確認用)、
# scripts/event-context.sh が judge/context-builder の起動時に近接イベントを 1 行に整形して
# prompt に渡す。近接イベントがある日はシグナルの確信度を抑える材料にする。
#
# ※SQ は event-context.sh が日付から計算で出す (日本=第2金 / 米=第3金 / 3・6・9・12月=メジャー)
#   ため、この yaml に SQ を並べる必要はない。yaml 内の jp-sq/us-sq は二重計上回避のため
#   event-context.sh では無視される (events.ts の人間向け一覧には出る)。
#
# 半導体 (285A/6857/6920) は金利感応度が高く FOMC で大きく振れる。
# SQ (特にメジャーSQ) 前後は先物・オプションの清算で需給が歪み、
# 寄り付き〜大引けの値動きが普段と変わる。デイトレ・スイング両方に効く。
#
# フィールド:
#   - date: YYYY-MM-DD (イベント発生日 / 結果が出る日)。
#       FOMC のように複数日開催のものは「結果が出る日」を入れる
#       (FOMC は2日目の声明発表日。日本時間では翌朝になる点に注意 = JST では翌日に効く)。
#   - kind: 種別。fomc / boj / us-sq / jp-sq / us-cpi / us-jobs / opec など任意のタグ。
#   - label: 表示名。
#   - impact: high / medium / low。high は近接時にシグナル確信度を強めに抑える想定。
#   - jst_effect_date: そのイベントが「日本市場の値動きに効く営業日」(任意)。
#       米国イベントは現地夜 = 日本の翌営業日に効くので、必要なら明示する。
#       省略時は date と同じ扱い。
#   - note: 補足。
#
# メンテ方針:
#   - 過去日になったイベントは消さなくてよい (events.ts は未来分のみ表示する)。
#     ただし溜まったら適宜整理する。
#   - SQ は計算で出るので追記不要。手動で並べるのは FOMC / 日銀 / CPI / 雇用統計 等の
#     「計算できないイベント」だけ。FOMC・日銀は公式が年初に当年の全日程を出すので、
#     年に一度まとめて転記すればよい (FOMC: federalreserve.gov の FOMC calendar、
#     日銀: boj.or.jp の公表予定)。CPI/雇用統計は毎月なので必要分だけ足す。

events:
  # ── 2026年6月 ──
  - date: "2026-06-12"
    kind: "jp-sq"
    label: "日本 メジャーSQ (6月限)"
    impact: "high"
    note: "3/6/9/12月は先物・オプション両方の清算でメジャーSQ。SQ前後は需給歪み。"

  # ── 2026年7月 ──
  - date: "2026-07-10"
    kind: "jp-sq"
    label: "日本 SQ (7月限・オプションのみ)"
    impact: "medium"
    note: "第2金曜。メジャーではないがオプション清算で値動きあり。"
  - date: "2026-07-29"
    kind: "fomc"
    label: "FOMC 政策金利発表 (7月会合)"
    impact: "high"
    jst_effect_date: "2026-07-30"
    note: "声明は現地7/29夕 = 日本7/30早朝。半導体は金利感応度高く翌日大きく振れやすい。"

  # ── 2026年8月 ──
  - date: "2026-08-14"
    kind: "jp-sq"
    label: "日本 SQ (8月限・オプションのみ)"
    impact: "medium"
    note: "第2金曜。"

  # ── 2026年9月 ──
  - date: "2026-09-11"
    kind: "jp-sq"
    label: "日本 メジャーSQ (9月限)"
    impact: "high"
    note: "メジャーSQ。"
  - date: "2026-09-16"
    kind: "fomc"
    label: "FOMC 政策金利発表 (9月会合)"
    impact: "high"
    jst_effect_date: "2026-09-17"
    note: "声明は現地9/16夕 = 日本9/17早朝。"
