# ピア決算カレンダー定義 (海外SOX系 + 国内の先行ピア)
#
# 監視銘柄 (worker/src/lib/watchlist.ts) はいずれも半導体・電子部品で、SOX (フィラデルフィア
# 半導体指数) 経由で海外ピアの決算に連動する。MU/NVDA/AMAT 等の大物が決算を出すと、結果次第で
# 翌日の SOX が振れ、日本の半導体株がギャップで寄る。国内の先行ピアは、監視銘柄より先に出る
# 受注・見通しとして監視銘柄の業績を先に示す。
# いずれも「いつ起きるか先に分かる」スケジュール型イベントなので、FOMC/日銀と同じく事前に
# カレンダー化して ticker-brief / crash-scenario の prompt に載せる。
#
# データの流れ:
#   Worker (eod cron) が海外ピアは Nasdaq、国内ピアは kabutan から次回決算日を取得 →
#   D1 macro_events に kind=peer_earnings:<TICKER> (海外) / peer_earnings_jp:<code> (国内)
#   で保存 (worker/src/lib/peer-earnings.ts)。
#   worker/src/lib/event-context.ts が近接窓の peer 決算を拾い、/judge-context の
#   event_context に同梱して prompt に1行で埋め込む。
#
# 重要: Worker は読み取り専用FSでこの yaml を読めない。実行時の真の出所は
#   worker/src/lib/peer-earnings.ts の SOX_PEERS / JP_PEERS 定数。この yaml は人間が編集する
#   出所であり、ピアを増減するときは「この yaml」と「定数」の両方を一致させて直すこと。
#
# - ticker: Nasdaq のティッカー (US 上場 / 非US は ADR。例: TSMC=TSM, ASML=ASML)
# - name:   prompt に出す日本語通称
# - role:   セクター内での位置づけ (メモリ/前工程装置/検査装置/露光装置/ファウンドリ/GPU)
# - release: 決算の発表タイミング (after_close = 米国の引け後 / before_open = 米国の寄り前)

peers:
  - ticker: "MU"
    name: "マイクロン"
    role: "メモリ"
    release: "after_close"
  - ticker: "NVDA"
    name: "エヌビディア"
    role: "GPU"
    release: "after_close"
  - ticker: "AMAT"
    name: "アプライド"
    role: "前工程装置"
    release: "after_close"
  - ticker: "LRCX"
    name: "ラムリサーチ"
    role: "前工程装置"
    release: "after_close"
  - ticker: "KLAC"
    name: "KLA"
    role: "検査装置"
    release: "after_close"
  - ticker: "ASML"
    name: "ASML"
    role: "露光装置"
    release: "before_open"
  - ticker: "TSM"
    name: "TSMC"
    role: "ファウンドリ"
    release: "before_open"

# 国内の先行ピア。決算が毎四半期 watchlist 銘柄より前の日に出て、受注・見通しがその銘柄の業績に
# 当てはまる組だけを持つ (同日発表は翌日の値動きが揃うだけで先に読める中身が無いので持たない)。
# ticker-brief など個別銘柄の event_context には、その銘柄に先行するピアだけが載る。市場全体には載せない。
# - code: 証券コード / name: 表示名 / role: セクター内の位置づけ / leads: 決算が先に出る watchlist 銘柄
jp_peers:
  - code: "6146"
    name: "ディスコ"
    role: "後工程装置"
    leads: ["6857", "6920", "285A"]
  - code: "6857"
    name: "アドバンテスト"
    role: "テスター"
    leads: ["6920", "285A"]
  - code: "6981"
    name: "村田製作所"
    role: "電子部品"
    leads: ["6976"]
  - code: "6762"
    name: "TDK"
    role: "電子部品"
    leads: ["6976"]
