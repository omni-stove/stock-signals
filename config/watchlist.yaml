# 対象銘柄定義
# - code: 証券コード (ディレクトリ名にも使う)
# - name: 表示名
# - sector: セクター識別子 (scripts/sector.ts が同一 sector 内で相対強弱を比較)。
#     semiconductor / ai-software / it-game など。
# - sector_role: セクター内での位置づけメモ (memory/tester/inspection 等)。
# - aliases: ニュース本文で銘柄判定に使う別名・略称 (マクロ記事の route-news 判定に使用)
# - keywords: 銘柄関連と判断する文脈ワード (業界・製品など)
# - ir_url: IR/プレスリリース一覧ページ (個別スクレイプ対象、将来用)
# - news_url: 銘柄ページのニュース一覧。ここから取った記事は確定で
#             data/queue/<ticker>/ に入れる (route-newsを介さない)。
# - next_earnings_date: 次回決算発表予定日 (YYYY-MM-DD、未確定なら null)。
#     スイング判断の信頼度抑制に使う (analyze-ticker が参照)。
#     公式IRが正式日程を出していない時期は前年同期日付ベースの推定値を入れる
#     (推定でも持ち越しガラの注意喚起には十分役立つ)。
#     この値は scripts/fetch-earnings-date.ts が cron で自動更新する
#     (kabutan の四半期テーブルから「前年同期の発表日 +1年」を推定し値だけ上書き。
#      このコメントは保持される)。決算発表後は翌営業日の cron で自動的に繰り上がるので
#     手動更新は原則不要。公式日程が出た等で手で直してもよいが、推定値と一致しなければ
#     次回 cron 実行時に再度上書きされる点に注意。
#     過去日が残ると analyze-ticker は days_to_earnings が負になり無視される
#     (= 制約なし扱い)。
# - fair_per: この銘柄に対して「妥当」と判断する予想PER (倍)。手動設定。
#     scripts/valuation.ts が逆算に使う:
#       必要EPS = 現在株価 / fair_per
#       必要な決算修正率 = (必要EPS - 会社予想EPS) / 会社予想EPS
#     例: fair_per=30 で必要EPSが会社予想を +33% 上回るなら、
#         「今の株価はPER30を正当化するのに +33% の上方修正を織り込んでいる」と読む。
#     null の銘柄は逆算をスキップ (現在PER/予想EPSの表示のみ)。
#     業種水準や自分の許容PERを踏まえて適宜更新する主観値。

tickers:
  - code: "285A"
    name: "キオクシアホールディングス"
    aliases: ["キオクシア", "KIOXIA", "Kioxia"]
    keywords: ["NAND", "フラッシュメモリ", "SSD", "半導体メモリ", "BiCS"]
    ir_url: "https://www.kioxia.com/ja-jp/about/news.html"
    news_url: "https://kabutan.jp/stock/news?code=285A"
    # 1Q (2027/3期): 公式未公表、前年Q1=2025-08-08 ベースの推定。公式日程が出たら上書き。
    next_earnings_date: "2026-08-08"
    # 半導体メモリ。予想EPS未開示時期は逆算スキップ。市況依存が大きく仮に20倍。
    fair_per: 20
    # セクター分析用 (scripts/sector.ts)。
    #  sector: 同一セクターでまとめる識別子。同じ sector の銘柄同士で相対強弱を比較する。
    #  sector_role: セクター内での位置づけ (メモ。memory/tester/inspection など)。
    sector: "semiconductor"
    sector_role: "memory"

  - code: "6857"
    name: "アドバンテスト"
    aliases: ["アドバンテスト", "Advantest"]
    keywords: ["半導体テスター", "SoCテスター", "メモリテスター", "HBM"]
    ir_url: "https://www.advantest.com/ja/news"
    news_url: "https://kabutan.jp/stock/news?code=6857"
    # 1Q (2027/3期): 公式は「7月」表示のみ、過去3年Q1=7/29,7/31,7/26 から推定。
    next_earnings_date: "2026-07-29"
    # 半導体テスター。現在予想PER ~40倍。高成長テスターとして仮に30倍。
    fair_per: 30
    sector: "semiconductor"
    sector_role: "tester"

  - code: "6920"
    name: "レーザーテック"
    aliases: ["レーザーテック", "Lasertec"]
    keywords: ["EUV", "マスク検査", "フォトマスク", "半導体検査"]
    ir_url: "https://www.lasertec.co.jp/news/"
    news_url: "https://kabutan.jp/stock/news?code=6920"
    # 通期 (2026/6期 本決算): 公式は「8月」表示のみ、過去3年通期=8/7 から推定。
    next_earnings_date: "2026-08-07"
    # EUVマスク検査。現在予想PER ~52倍。独占的地位を加味し仮に35倍。
    fair_per: 35
    sector: "semiconductor"
    sector_role: "inspection"

  - code: "6981"
    name: "村田製作所"
    aliases: ["村田製作所", "村田製", "Murata", "muRata"]
    keywords: ["MLCC", "積層セラミックコンデンサ", "電子部品", "通信モジュール", "スマホ部品"]
    ir_url: "https://corporate.murata.com/ja-jp/ir"
    news_url: "https://kabutan.jp/stock/news?code=6981"
    # 1Q (2027/3期): 公式未公表、前年Q1(25.04-06)=2025-07-30 ベースの推定。公式日程が出たら上書き。
    next_earnings_date: "2026-07-30"
    # 電子部品(MLCC)大手。現在予想PER ~67倍。高収益部品株として仮に30倍。
    fair_per: 30
    # 厳密には電子部品だが、スマホ/AI需要で半導体地合い(SOX)と連動しやすいため semiconductor に含める。
    sector: "semiconductor"
    sector_role: "components"
