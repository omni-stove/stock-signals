# Cloudflare Worker: stock-signals 収集 (PoC: fetch-ir のみ)
#
# 目的: Mac の cron に依存せず、銘柄の公式IR一次情報をクラウドで定期取得し、
#       記事を R2 に、取得済みURL(重複排除キー)を D1 に保存する。
#       analyze-ticker(ローカルのLLM判定)は別途 R2/D1 を読みに行く。
#
# ── 初回セットアップ (ユーザー操作が必要なものは README-cloud.md 参照) ──
#   npx wrangler login                    # ブラウザ認証
#   npx wrangler d1 create stock-signals  # → database_id を下の d1_databases に記入
#   npx wrangler r2 bucket create stock-signals-articles
#   pnpm db:migrate:remote                # drizzle migration をリモート D1 に適用 (スキーマは src/lib/schema.ts)
#
# ── ローカル検証 (ログイン/デプロイ不要、D1=ローカルSQLite/R2=ローカルFSをエミュレート) ──
#   npx wrangler dev
#   → 別ターミナルで: curl "http://localhost:8787/run?code=285A&limit=3"

name = "stock-signals-collector"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]   # cheerio 等の Node API 互換のため
account_id = "020120735d111b7d06111196719171c1"  # admin@omnistove.com

# Cron Triggers。cron は UTC 基準 (JST = UTC+9)。発火した cron 式を
# scheduled() 内で event.cron により判別し、取得種別を振り分ける。
# ※Cloudflare Cron は曜日の範囲指定 (0-4 等) を弾く (invalid cron string)。よって
#   cron 式は毎日発火のままとし、JST 土日のスキップは scheduled() 内で isJstWeekend()
#   ガードして行う (cron.ts 参照)。東証が開かない JST 土日は全種別をスキップする。
#   例外: 寄り前 intake `30 23 * * *` は UTC 日曜 23:30 = JST 月曜 08:30 に発火するため
#   JST 曜日では月曜扱いとなり残る (日本の日曜夜=米国の月曜朝の地合いを反映する)。
#
#   intake (寄り前/引け後): JST 08:30/20:00 = UTC 23:30(前日)/11:00。IR+ニュース収集
#                            (寄り前 08:30 のみ地合い=米国指数+日経先物も先に取得し、
#                             その直後に market-check ワークフローを dispatch する。地合いは個別
#                             signal-judge の前段ゲートなので後段判定より先に発火させる)
#                            引け後は 20:00。決算・適時開示は19時台以降に出ることもあり、その夜のうちに
#                            (寝る前/翌朝より早く) 拾えるよう遅めに置く。早い適時開示(15:30〜)は
#                            場中ループ尾の prices + 12:30 相当の IR intake である程度カバーされる。
#   prices (場中5分毎):      JST 09:00-15:00 = UTC 00:00-06:00 を5分毎。prices+ニュース速報。
#                            さらに JST 12:30 相当 (UTC 03:30) のスロットでは IR intake も相乗りさせる
#                            (event.scheduledTime の時刻で判定。下記 scheduled() 参照)。
#   eod (引け後1回):         JST 16:00 = UTC 07:00 で daily + fundamentals + 決算予定日推定
# ※Cloudflare の cron trigger 上限は5個。昼(12:30)の IR intake は専用 cron を立てず prices ループに
#   相乗りさせて4個に収める。ニュース収集は intake/prices に、決算予定日推定は eod に、
#   地合い取得は寄り前 intake に相乗りさせ、scheduled() 内で順に実行する。
[triggers]
crons = [
  "30 23 * * *",    # JST 08:30 寄り前 IR + ニュース + 地合い (+ market-check を dispatch)
  "0 11 * * *",     # JST 20:00 引け後 IR + ニュース
  "*/5 0-6 * * *",  # JST 09:00-15:00 5分毎  prices + ニュース速報 (12:30 相当スロットで IR intake も)
  "0 7 * * *",      # JST 16:00 引け後  daily + fundamentals + earnings (eod)
]

# D1: 取得済みURLハッシュ(重複排除)と記事メタを持つ。
# スキーマの真の情報源は src/lib/schema.ts。drizzle-kit が差分 migration を drizzle/ に生成し、
# wrangler d1 migrations apply (migrations_dir=drizzle) が適用する。手書き schema.sql は廃止。
[[d1_databases]]
binding = "DB"
database_name = "stock-signals"
database_id = "13ca8c54-1dcc-45dc-8168-0a493e74ec46"  # APAC, 2026-06-17 作成
migrations_dir = "drizzle"  # drizzle-kit generate の出力先と揃える

# R2: 記事本文JSON (data/queue 相当) を置く。
[[r2_buckets]]
binding = "ARTICLES"
bucket_name = "stock-signals-articles"

[vars]
USER_AGENT = "stock-signals-bot/0.1 (personal research; contact: admin@omnistove.com)"
# kabutan への連続アクセス間隔 (記事ごとの fetch 直前に待つ)。引け後 (20:00) intake は全収集を
# 直列に回すため、この値が大きいと待ち時間が積み上がり (ratings だけで sleep×8 ≒ 40 秒)、収集全体が
# 80 秒級になっていた。礼儀の範囲で 2 秒に抑え、intake 全体のウォールクロックを圧縮する。
MIN_INTERVAL_MS = "2000"
# GitHub App (omnistove-internal-auth) で signal-update を repository_dispatch 起動する。
# App ID と installation ID は秘密でないので vars。private key だけ Secret:
#   npx wrangler secret put GH_APP_PRIVATE_KEY   (.pem の中身を貼る)
GH_APP_ID = "1625136"
GH_APP_INSTALL_ID = "76413001"
GITHUB_REPO = "omni-stove/stock-signals"
